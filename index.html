<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>길드전</title>

<style>
:root{
  --bg:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --blue:#3b82f6;
  --sky:#bfe2ff;
}

body{
  margin:0;
  background:var(--bg);
  font-family: system-ui, -apple-system, Segoe UI, Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color:var(--text);
}

.wrap{
  max-width:420px;
  margin:0 auto;
  padding:18px 16px 30px;
}

h1{
  text-align:center;
  margin:4px 0 6px;
  font-size:22px;
}

.desc{
  text-align:center;
  font-size:13px;
  color:var(--muted);
  margin-bottom:14px;
}

.label{
  font-size:13px;
  font-weight:800;
  margin:10px 0;
}

.slots{
  display:flex;
  gap:12px;
}

.slot{
  flex:1;
  height:92px;
  border:2px dashed var(--line);
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  cursor:pointer;
}

.slot.filled{
  border-style:solid;
  border-color:#c7ddff;
}

.slot .plus{
  font-size:26px;
  font-weight:900;
  color:var(--blue);
}

.slot img{
  width:44px;
  height:44px;
  border-radius:10px;
}

.slot .name{
  position:absolute;
  bottom:8px;
  left:8px;
  right:8px;
  font-size:12px;
  font-weight:800;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.slot .remove{
  position:absolute;
  top:6px;
  right:6px;
  width:22px;
  height:22px;
  border-radius:999px;
  border:1px solid var(--line);
  background:#fff;
  font-weight:900;
  display:none;
}

.slot.filled .remove{ display:block; }

.btnRow{
  display:flex;
  gap:12px;
  margin-top:14px;
}

.btn{
  flex:1;
  height:44px;
  border-radius:10px;
  border:1px solid #dbeafe;
  background:#fff;
  font-weight:800;
}

.btn.primary{
  background:var(--sky);
  border-color:#93c5fd;
}

.resultHead{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  font-size:13px;
  font-weight:900;
}

.resultBox{
  margin-top:8px;
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
  background:#fff;
}

/* ===== 결과 카드 ===== */
.card{
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
}

/* 상단 2열 고정 */
.mainGrid{
  display:grid;
  grid-template-columns:1fr 110px;
  gap:12px;
}

/* 좌측 큰 박스 */
.panel{
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
}

.panelTitle{
  font-size:12px;
  font-weight:900;
  margin-bottom:8px;
}

/* 공격 유닛 / 스킬 공통 높이 규격 */
.block{
  min-height:108px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

/* 3칸 고정 */
.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

/* 스킬은 화살표 포함 */
.gridSkill{
  display:grid;
  grid-template-columns:1fr 18px 1fr 18px 1fr;
  gap:10px;
  align-items:center;
}

/* 셀 */
.cell{
  text-align:center;
}

.cell img{
  width:54px;
  height:54px;
  border-radius:14px;
  border:1px solid rgba(0,0,0,.06);
  background:#f3f4f6;
}

.cell .cap{
  margin-top:4px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.empty{
  color:#9ca3af;
  font-size:12px;
  font-weight:700;
}

/* 화살표 */
.arrow{
  text-align:center;
  font-size:18px;
  font-weight:900;
  color:#cbd5e1;
}

/* 우측 */
.badge{
  display:inline-flex;
  justify-content:center;
  align-items:center;
  height:26px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
  color:#fff;
  margin-top:6px;
}

.badge.red{ background:#ef4444; }
.badge.blue{ background:#3b82f6; }
.badge.gray{ background:#9ca3af; }

/* 노트 */
.noteBox{
  margin-top:10px;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  background:#fafafa;
}

.noteTitle{
  font-size:12px;
  font-weight:900;
  color:#1e5aa8;
  margin-bottom:6px;
}

.noteText{
  font-size:12px;
  line-height:1.4;
  white-space:pre-wrap;
  max-height:4.2em; /* 약 3줄 */
  overflow-y:auto;
}

/* modal */
.modalBack{
  position:fixed;
  inset:0;
  background:rgba(17,24,39,.45);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:14px;
  border:1px solid var(--line);
}

.modalHeader{
  display:flex;
  justify-content:space-between;
  padding:14px;
  border-bottom:1px solid var(--line);
}

.search{
  padding:10px 12px;
  border-bottom:1px solid var(--line);
}

.search input{
  width:100%;
  height:42px;
  border-radius:10px;
  border:1px solid #dbeafe;
  padding:0 12px;
}

#unitList{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  padding:14px;
  max-height:420px;
  overflow:auto;
}

.item{
  border:1px solid var(--line);
  border-radius:12px;
  padding:8px;
  text-align:center;
  cursor:pointer;
}
</style>
</head>

<body>
<div class="wrap">
  <h1>길드전</h1>
  <p class="desc">방어 유닛 3명을 선택하면 결과를 조회합니다</p>

  <div class="label">방어 유닛 선택</div>
  <div class="slots">
    <div class="slot" data-slot="0"><div class="plus">+</div><button class="remove">×</button></div>
    <div class="slot" data-slot="1"><div class="plus">+</div><button class="remove">×</button></div>
    <div class="slot" data-slot="2"><div class="plus">+</div><button class="remove">×</button></div>
  </div>

  <div class="btnRow">
    <button class="btn" id="btnReset">초기화</button>
    <button class="btn primary" id="btnSearch">검색</button>
  </div>

  <div class="resultHead">
    <div>결과</div>
    <div id="statusText">검색 전</div>
  </div>

  <div class="resultBox" id="resultBox">방어 유닛 3명을 선택해 주세요</div>
</div>
