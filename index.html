<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>길드전</title>

  <style>
    :root{
      --bg:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --blue:#3b82f6;
      --sky:#bfe2ff;
      --card:#ffffff;
      --kakao:#FEE500;
      --kakaoText:#191600;
    }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap{
      max-width: 420px;
      margin: 0 auto;
      padding: 18px 16px 28px;
    }

    h1{
      margin: 4px 0 6px;
      font-size: 22px;
      text-align:center;
    }

    .desc{
      margin: 0 0 14px;
      font-size: 13px;
      color: var(--muted);
      text-align:center;
      line-height:1.35;
    }

    .label{
      font-size: 13px;
      font-weight: 800;
      margin: 10px 0 10px;
    }

    /* ===== 게이트(로그인) ===== */
    .gateWrap{
      max-width: 420px;
      margin: 0 auto;
      padding: 18px 16px 10px;
    }
    .gateCard{
      border:1px solid var(--line);
      border-radius:14px;
      background:#fff;
      padding:14px;
    }
    .gateTitle{
      font-weight: 900;
      font-size: 16px;
      margin: 0 0 6px;
      text-align:center;
    }
    .gateDesc{
      margin: 0 0 12px;
      font-size: 12px;
      color: var(--muted);
      text-align:center;
      line-height:1.4;
    }
    .gateBtn{
      width:100%;
      height: 44px;
      border-radius: 12px;
      border: 0;
      cursor:pointer;
      font-weight: 900;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }
    .gateBtn.kakao{
      background: var(--kakao);
      color: var(--kakaoText);
    }
    .kakaoBadge{
      width:22px;height:22px;
      border-radius:6px;
      background: rgba(0,0,0,.08);
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }

    /* ✅ 겹침 방지: 기본은 2열, 좁으면 세로로 자동 전환 */
    .gateRow{
      display:flex;
      gap:10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .gateRow > div{
      flex: 1 1 0;
      min-width: 0;
    }

    .gateLabel{
      font-size: 12px;
      color: var(--muted);
      font-weight: 800;
      margin: 10px 0 6px;
    }

    /* ✅ 입력창 크기 약간 축소 + box-sizing 강제 */
    .gateInput{
      width:100%;
      height: 40px;
      border-radius: 12px;
      border: 1px solid #dbeafe;
      padding: 0 12px;
      font-size: 14px;
      outline:none;
      box-sizing: border-box;
    }
    .gateInput:focus{
      border-color:#93c5fd;
      box-shadow: 0 0 0 4px rgba(59,130,246,.12);
    }

    .gateBtn.primary{
      margin-top: 12px;
      background: var(--sky);
      border: 1px solid #93c5fd;
      color: #0f172a;
    }
    .gateMsg{
      margin-top: 10px;
      font-size: 12px;
      color: #991b1b;
      font-weight: 900;
      display:none;
      background:#fee2e2;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #fecaca;
    }
    .gateHelp{
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      text-align:center;
    }
    .gateHelp a{
      color:#1d4ed8;
      font-weight: 900;
      text-decoration:none;
    }
    .gateHelp a:hover{ text-decoration:underline; }

    @media (max-width: 420px){
      .gateRow > div{
        flex: 1 1 100%;
      }
    }

    /* ===== 상단 3칸 슬롯 ===== */
    .slots{
      display:flex;
      gap:12px;
      justify-content: space-between;
    }

    .slot{
      width: 110px;
      height: 92px;
      border: 2px dashed var(--line);
      border-radius: 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      position: relative;
      background: #fff;
      cursor: pointer;
      user-select:none;
    }

    .slot .plus{
      font-size: 26px;
      color: var(--blue);
      font-weight: 900;
      line-height:1;
    }

    .slot.filled{
      border-style: solid;
      border-color: #c7ddff;
    }

    .slot .thumb{
      width: 44px;
      height: 44px;
      border-radius: 10px;
      overflow:hidden;
      border: 1px solid var(--line);
      background:#f3f4f6;
    }
    .slot .thumb img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
    }

    .slot .name{
      position:absolute;
      left: 10px;
      right: 10px;
      bottom: 8px;
      font-size: 12px;
      font-weight: 800;
      text-align:center;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .slot .remove{
      position:absolute;
      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background:#fff;
      font-weight: 900;
      cursor:pointer;
      display:none;
      line-height: 20px;
    }
    .slot.filled .remove{ display:block; }

    .btnRow{
      display:flex;
      gap:12px;
      margin-top: 14px;
    }

    .btn{
      flex:1;
      height: 44px;
      border-radius: 10px;
      border: 1px solid #dbeafe;
      background:#fff;
      font-weight: 800;
      cursor:pointer;
    }
    .btn.primary{
      background: var(--sky);
      border-color: #93c5fd;
    }

    .resultHead{
      margin-top: 18px;
      display:flex;
      justify-content: space-between;
      align-items:center;
      font-weight: 900;
      font-size: 13px;
    }
    .resultHead .right{
      color: var(--muted);
      font-weight: 700;
      font-size: 12px;
    }

    .resultBox{
      margin-top: 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      min-height: 54px;
      font-size: 13px;
      color: var(--muted);
      background:#fff;
    }

    /* ===== 페이저 ===== */
    .resultToolbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:10px;
    }

    .pager{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .pagerBtn{
      height:32px;
      min-width:38px;
      border-radius:10px;
      border:1px solid #dbeafe;
      background:#fff;
      font-weight:900;
      cursor:pointer;
    }
    .pagerBtn:disabled{
      opacity:.45;
      cursor:not-allowed;
    }

    .pageInfo{
      font-size:12px;
      font-weight:800;
      color:#374151;
      min-width:70px;
      text-align:center;
    }

    /* ===== 결과 카드 UI ===== */
    .card{
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
      background: var(--card);
      color: var(--text);
    }

    /* ✅ 1번: 얇은 한줄 */
    .importantBar{
      border:1px solid var(--line);
      border-radius:12px;
      background:#fff;
      padding: 8px 10px;
      display:flex;
      align-items:center;
      gap:8px;
      min-height: 34px;
      line-height: 1.2;
      margin-bottom: 12px;
    }
    .importantBar .ico{
      font-size: 15px;
      flex: 0 0 auto;
    }
    .importantBar .txt{
      font-size: 12px;
      font-weight: 900;
      color:#111827;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    /* ✅ 2~7 레이아웃: (왼쪽: 2/4/7) (오른쪽: 3/5/6) */
    .gridLayoutV2{
      display:grid;
      grid-template-columns: 1fr 104px;
      gap:12px;
      align-items:stretch;
    }

    .stackCol{
      display:flex;
      flex-direction:column;
      gap:12px;
      min-width:0;
    }

    .panel{
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px;
      background:#fff;
      min-width:0;
    }

    .panel.large{ min-height: 122px; } /* 2/4/7 */
    .panel.small{ min-height: 122px; } /* 3/5/6 */
    /* 위 2개는 동일 min-height로 “딱 떨어지는 느낌”을 강제.
       내용이 더 많으면 자연스럽게 늘어나고, 기본 높이는 맞춰짐 */

    .panelTitle{
      font-size:12px;
      font-weight:900;
      color:#111827;
      margin-bottom:8px;
    }

    .grid3{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:8px;
    }

    .cell{
      text-align:center;
      min-width:0;
    }

    .cell img{
      width:48px;
      height:48px;
      border-radius:14px;
      object-fit:cover;
      border:1px solid rgba(0,0,0,.06);
      background:#f3f4f6;
      display:block;
      margin:0 auto;
    }

    .cap{
      margin-top:4px;
      font-size:11px;
      font-weight:800;
      color:#374151;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .emptyBox{
      width:48px;
      height:48px;
      border-radius:14px;
      background:#f3f4f6;
      border:1px solid rgba(0,0,0,.06);
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#9ca3af;
      font-weight:900;
      font-size:11px;
    }

    .centerCol{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      text-align:center;
      min-width:0;
    }

    .centerCol .panelTitle{
      width:100%;
      text-align:center;
      margin-bottom:10px;
    }

    .petName{
      margin-top:6px;
      font-size:11px;
      font-weight:900;
      color:#111827;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      width:100%;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      height:26px;
      padding:0 10px;
      border-radius:999px;
      font-weight:900;
      font-size:12px;
      color:#fff;
      margin-top:6px;
    }
    .badge.red{ background:#ef4444; }
    .badge.blue{ background:#3b82f6; }
    .badge.gray{ background:#9ca3af; }

    /* ✅ 공격유닛 클릭 가능 표시 */
    .clickableUnit img{
      cursor:pointer;
      transition: transform .08s ease;
    }
    .clickableUnit img:active{
      transform: scale(.98);
    }

    /* ✅ 6번 진형(텍스트/이미지) */
    .formationWrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
      width:100%;
    }
    .formationTag{
      font-size:11px;
      font-weight:900;
      color:#111827;
      background:#eef2ff;
      border:1px solid #dbeafe;
      padding: 6px 10px;
      border-radius: 999px;
      max-width:100%;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .formationImg{
      width: 76px;
      height: 76px;
      border-radius: 14px;
      object-fit: cover;
      border:1px solid rgba(0,0,0,.06);
      background:#f3f4f6;
      display:block;
    }

    /* ✅ 7번 텍스트 */
    .textBox{
      font-size:12px;
      line-height:1.4;
      color:#111827;
      white-space:pre-wrap;
      max-height: 5.6em;
      overflow:auto;
      padding-right:6px;
    }

    /* ===== modal(유닛 선택) ===== */
    .modalBack{
      position: fixed;
      inset: 0;
      background: rgba(17,24,39,.45);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 16px;
      z-index: 9999;
    }
    .modal{
      position:relative;
      z-index:10000;
      width: 100%;
      max-width: 420px;
      background:#fff;
      border-radius: 14px;
      overflow:hidden;
      border: 1px solid var(--line);
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
    }
    .modalHeader{
      display:flex;
      align-items:center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background:#fff;
    }
    .modalHeader .title{
      font-weight: 900;
      font-size: 14px;
    }
    .modalHeader .close{
      border:1px solid var(--line);
      background:#fff;
      border-radius: 10px;
      padding: 6px 10px;
      cursor:pointer;
      font-weight:900;
    }
    .search{
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background:#fff;
    }
    .search input{
      width:100%;
      height: 42px;
      border-radius: 10px;
      border: 1px solid #dbeafe;
      padding: 0 12px;
      font-size: 14px;
      outline:none;
    }

    #unitList{
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding: 14px 14px 16px;
      max-height: 420px;
      overflow:auto;
      background:#fff;
    }

    #unitList .item{
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 10px 8px;
      border-radius: 14px;
      border: 1px solid #e8eef7;
      background: #fff;
      cursor: pointer;
    }

    #unitList .item:hover{
      border-color:#93c5fd;
      background:#f8fbff;
    }

    #unitList .thumb{
      width: 64px;
      height: 64px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      background:#f3f4f6;
    }
    #unitList .thumb img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
    }

    #unitList .name{
      font-weight: 800;
      font-size: 12px;
      line-height: 1.15;
      letter-spacing: -0.2px;
      text-align: center;
      word-break: keep-all;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      color:#111827;
    }

    .hint{
      padding: 10px 12px 14px;
      color: var(--muted);
      font-size: 12px;
      border-top: 1px dashed var(--line);
      background:#fff;
    }

    /* ===== ✅ 세트 추천 모달 ===== */
    .setModalBack{
      position: fixed;
      inset: 0;
      background: rgba(17,24,39,.45);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 16px;
      z-index: 10001; /* 유닛선택 모달보다 위 */
    }
    .setModal{
      width:100%;
      max-width: 420px;
      background:#fff;
      border-radius:14px;
      overflow:hidden;
      border:1px solid var(--line);
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
    }
    .setBody{
      padding: 12px 14px 14px;
    }
    .setTopUnit{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom: 10px;
    }
    .setTopUnit .uimg{
      width:52px;height:52px;border-radius:14px;
      object-fit:cover;
      border:1px solid rgba(0,0,0,.06);
      background:#f3f4f6;
    }
    .setTopUnit .uname{
      font-weight: 900;
      font-size: 14px;
      color:#111827;
      line-height:1.2;
    }
    .setGrid{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:10px;
      margin-top: 10px;
    }
    .setItem{
      border:1px solid #e8eef7;
      border-radius:14px;
      padding:10px 8px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
      background:#fff;
      min-width:0;
    }
    .setItem img{
      width:64px;height:64px;border-radius:14px;
      object-fit:cover;
      border:1px solid rgba(0,0,0,.06);
      background:#f3f4f6;
    }
    .setItem .sname{
      font-size:12px;
      font-weight:900;
      color:#111827;
      text-align:center;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      width:100%;
    }
    .setComment{
      margin-top: 12px;
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px 10px;
      background:#fff;
    }
    .setComment .title{
      font-size:12px;
      font-weight:900;
      margin-bottom:6px;
      color:#111827;
    }
    .setComment .text{
      font-size:12px;
      line-height:1.45;
      white-space:pre-wrap;
      color:#111827;
      max-height: 8.2em;
      overflow:auto;
      padding-right:6px;
    }

    @media (max-width: 360px){
      .gridLayoutV2{ grid-template-columns: 1fr 96px; }
      .cell img, .emptyBox{ width:46px; height:46px; }
      .cap{ font-size:10.5px; }
      .petName{ font-size:10.5px; }
      .formationImg{ width:72px; height:72px; }
    }
  </style>
</head>

<body>
  <!-- ✅ 1) 게이트 화면 -->
  <div id="gate" class="gateWrap">
    <div class="gateCard">
      <div class="gateTitle">VLRT길드 열람 코드 입력</div>

      <div class="gateDesc">
        먼저 카카오톡으로 연락해 <b>아이디 + 코드번호</b>를 받으세요.<br/>
        받은 뒤 아래에 입력하면 열람 가능합니다.
      </div>

      <button class="gateBtn kakao" id="btnKakao" type="button">
        <span class="kakaoBadge" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M12 3C6.477 3 2 6.582 2 11c0 2.74 1.77 5.15 4.5 6.62L5.8 21l4.03-2.2c.7.1 1.43.15 2.17.15 5.523 0 10-3.582 10-8s-4.477-8-10-8Z" fill="#191600" opacity=".92"/>
            <path d="M8.3 10.2h7.4M8.3 12.2h5.2" stroke="#FEE500" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </span>
        코드 받기 (카카오톡)
      </button>

      <div class="gateRow">
        <div>
          <div class="gateLabel">아이디</div>
          <input id="gateId" class="gateInput" inputmode="numeric" placeholder="입력:" />
        </div>
        <div>
          <div class="gateLabel">코드</div>
          <input id="gateCode" class="gateInput" inputmode="numeric" placeholder="입력:" />
        </div>
      </div>

      <button class="gateBtn primary" id="btnGateEnter" type="button">확인</button>

      <div id="gateMsg" class="gateMsg"></div>

      <div class="gateHelp">
        문제가 있으면 <a href="https://open.kakao.com/o/smXJOCfi" target="_blank" rel="noopener">관리자에게 카카오톡으로 연락</a>해주세요.
      </div>
    </div>
  </div>

  <!-- ✅ 2) 기존 길드전 UI (그대로) -->
  <div id="app" class="wrap" style="display:none;">
    <h1>길드전</h1>
    <p class="desc">방어 유닛 3명을 선택하면 해당 구성에 대한 결과를 조회합니다</p>

    <div class="label">방어 유닛 선택</div>

    <div class="slots">
      <div class="slot" data-slot="0" aria-label="slot 1">
        <div class="plus">+</div>
        <button class="remove" title="제거" aria-label="remove 1">×</button>
      </div>

      <div class="slot" data-slot="1" aria-label="slot 2">
        <div class="plus">+</div>
        <button class="remove" title="제거" aria-label="remove 2">×</button>
      </div>

      <div class="slot" data-slot="2" aria-label="slot 3">
        <div class="plus">+</div>
        <button class="remove" title="제거" aria-label="remove 3">×</button>
      </div>
    </div>

    <div class="btnRow">
      <button class="btn" id="btnReset">초기화</button>
      <button class="btn primary" id="btnSearch">검색</button>
    </div>

    <div class="resultHead">
      <div class="left">결과</div>
      <div class="right" id="statusText">검색 전</div>
    </div>

    <div class="resultBox" id="resultBox">방어 유닛 3명을 선택해 주세요</div>
  </div>

  <!-- modal: 유닛 선택 -->
  <div class="modalBack" id="modalBack" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modalHeader">
        <div class="title">유닛 선택</div>
        <button class="close" id="btnClose" aria-label="닫기">닫기</button>
      </div>
      <div class="search">
        <input id="searchInput" placeholder="이름 검색 (예: 루디)" />
      </div>
      <div id="unitList"></div>
      <div class="hint">유닛을 선택하고 방어 3명을 채운 뒤 검색하세요.</div>
    </div>
  </div>

  <!-- ✅ modal: 세트 추천/설명 -->
  <div class="setModalBack" id="setModalBack" role="dialog" aria-modal="true">
    <div class="setModal">
      <div class="modalHeader">
        <div class="title" id="setModalTitle">세트 추천</div>
        <button class="close" id="btnSetClose" aria-label="닫기">닫기</button>
      </div>
      <div class="setBody" id="setModalBody"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // =========================================================
    // ✅ 1) Supabase 연결 (기존 유지)
    // =========================================================
    const SUPABASE_URL = "https://rtlkthadgfyszawgbevk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Vsr12aXc5r8kCnjBnpvrcQ_4Enqbi3F";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // =========================================================
    // ✅ 2) 게이트(아이디+코드번호) 로직 (DB/RPC 검증 버전) (기존 유지)
    // =========================================================
    const KAKAO_LINK = "https://open.kakao.com/o/smXJOCfi";
    const SESSION_KEY = "guild_gate_ok_v1";

    const gateEl = document.getElementById("gate");
    const appEl = document.getElementById("app");
    const gateMsgEl = document.getElementById("gateMsg");

    const btnKakao = document.getElementById("btnKakao");
    const btnGateEnter = document.getElementById("btnGateEnter");
    const gateIdInput = document.getElementById("gateId");
    const gateCodeInput = document.getElementById("gateCode");

    function showGateMsg(msg){
      gateMsgEl.style.display = "block";
      gateMsgEl.textContent = msg;
    }
    function clearGateMsg(){
      gateMsgEl.style.display = "none";
      gateMsgEl.textContent = "";
    }

    function passGate(){
      localStorage.setItem(SESSION_KEY, "1");
      gateEl.style.display = "none";
      appEl.style.display = "block";
      initGuildWar();
    }

    function failGate(msg){
      localStorage.removeItem(SESSION_KEY);
      gateEl.style.display = "block";
      appEl.style.display = "none";
      showGateMsg(msg);
    }

    function basicCheck(idStr, codeStr){
      const id = Number(String(idStr || "").trim());
      const code = Number(String(codeStr || "").trim());

      if(!Number.isInteger(id)) return { ok:false, msg:"아이디는 숫자만 입력해 주세요." };
      if(!Number.isInteger(code)) return { ok:false, msg:"코드는 숫자만 입력해 주세요." };

      return { ok:true, id, code };
    }

    btnKakao.addEventListener("click", () => {
      window.open(KAKAO_LINK, "_blank", "noopener");
    });

    btnGateEnter.addEventListener("click", async () => {
      clearGateMsg();
      btnGateEnter.disabled = true;

      const chk = basicCheck(gateIdInput.value, gateCodeInput.value);
      if(!chk.ok){
        btnGateEnter.disabled = false;
        failGate(chk.msg);
        return;
      }

      try{
        const { data, error } = await supabaseClient.rpc("check_guild_access_code", {
          p_account_id: chk.id,
          p_code: chk.code
        });

        if(error){
          console.error(error);
          btnGateEnter.disabled = false;
          failGate("서버 확인 중 오류가 발생했어요. 잠시 후 다시 시도해주세요.");
          return;
        }

        if(data === true){
          btnGateEnter.disabled = false;
          passGate();
        }else{
          btnGateEnter.disabled = false;
          failGate("아이디/코드가 올바르지 않거나 비활성화된 코드입니다. 관리자에게 문의해주세요.");
        }
      }catch(err){
        console.error(err);
        btnGateEnter.disabled = false;
        failGate("네트워크 오류가 발생했어요. 잠시 후 다시 시도해주세요.");
      }
    });

    [gateIdInput, gateCodeInput].forEach(inp => {
      inp.addEventListener("keydown", (e) => {
        if(e.key === "Enter") btnGateEnter.click();
      });
    });

    if(localStorage.getItem(SESSION_KEY) === "1"){
      gateEl.style.display = "none";
      appEl.style.display = "block";
      initGuildWar();
    }else{
      gateEl.style.display = "block";
      appEl.style.display = "none";
    }

    // =========================================================
    // ✅ 3) 길드전 로직 (기존 유지 + 결과 UI/모달만 반영)
    // =========================================================
    function initGuildWar(){
      if(window.__GUILD_INITED__) return;
      window.__GUILD_INITED__ = true;

      const slots = [null, null, null];
      let activeSlotIndex = 0;

      let UNITS = [];
      let RESULTS = [];
      let currentIndex = 0;

      const modalBack = document.getElementById("modalBack");
      const unitListEl = document.getElementById("unitList");
      const searchInput = document.getElementById("searchInput");
      const statusText = document.getElementById("statusText");
      const resultBox = document.getElementById("resultBox");

      // ✅ 세트 모달
      const setModalBack = document.getElementById("setModalBack");
      const setModalBody = document.getElementById("setModalBody");
      const setModalTitle = document.getElementById("setModalTitle");
      const btnSetClose = document.getElementById("btnSetClose");

      function escapeHtml(str) {
        return String(str ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function renderSlots(){
        document.querySelectorAll(".slot").forEach((el) => {
          const idx = Number(el.dataset.slot);
          const s = slots[idx];

          el.classList.toggle("filled", !!s);
          el.innerHTML = "";

          const rm = document.createElement("button");
          rm.className = "remove";
          rm.title = "제거";
          rm.textContent = "×";
          rm.addEventListener("click", (e) => {
            e.stopPropagation();
            clearSlot(idx);
          });
          el.appendChild(rm);

          if(!s){
            const plus = document.createElement("div");
            plus.className = "plus";
            plus.textContent = "+";
            el.appendChild(plus);
            return;
          }

          const thumb = document.createElement("div");
          thumb.className = "thumb";
          const img = document.createElement("img");
          img.src = s.image_url;
          img.alt = s.name;
          thumb.appendChild(img);

          const nm = document.createElement("div");
          nm.className = "name";
          nm.textContent = s.name;

          el.appendChild(thumb);
          el.appendChild(nm);
        });
      }

      function updateResultHint(){
        const chosen = slots.filter(Boolean);
        if(chosen.length < 3){
          statusText.textContent = "검색 전";
          resultBox.textContent = "방어 유닛 3명을 선택해 주세요";
          RESULTS = [];
          currentIndex = 0;
          return;
        }
        statusText.textContent = "준비됨";
        resultBox.textContent = `선택됨: ${chosen.map(x=>x.name).join(", ")}`;
      }

      function renderUnitList(list){
        unitListEl.innerHTML = "";
        list.forEach((u) => {
          const row = document.createElement("div");
          row.className = "item";
          row.innerHTML = `
            <div class="thumb"><img src="${u.image_url}" alt="${escapeHtml(u.name)}"></div>
            <div class="name">${escapeHtml(u.name)}</div>
          `;
          row.addEventListener("click", () => {
            setSlot(activeSlotIndex, u);
            closeModal();
          });
          unitListEl.appendChild(row);
        });

        if(list.length === 0){
          unitListEl.innerHTML = `<div style="padding:14px;color:#6b7280;font-size:13px;">검색 결과가 없습니다</div>`;
        }
      }

      function setSlot(i, unit){
        const already = slots.findIndex(s => s && s.name === unit.name);
        if(already !== -1 && already !== i){
          alert("이미 선택된 유닛입니다.");
          return;
        }
        slots[i] = { id: unit.id, name: unit.name, image_url: unit.image_url };
        renderSlots();
        updateResultHint();
      }

      function clearSlot(i){
        slots[i] = null;
        renderSlots();
        updateResultHint();
      }

      function openModal(slotIndex){
        activeSlotIndex = slotIndex;
        modalBack.style.display = "flex";
        searchInput.value = "";
        renderUnitList(UNITS);
        setTimeout(() => searchInput.focus({ preventScroll:true }), 50);
      }
      function closeModal(){
        modalBack.style.display = "none";
      }

      document.getElementById("btnClose").addEventListener("click", closeModal);
      modalBack.addEventListener("click", (e) => {
        if(e.target === modalBack) closeModal();
      });
      document.querySelectorAll(".slot").forEach((el) => {
        el.addEventListener("click", () => openModal(Number(el.dataset.slot)));
      });

      // =========================
      // ✅ 세트 모달 (공격유닛 클릭)
      // =========================
      function closeSetModal(){
        setModalBack.style.display = "none";
      }
      btnSetClose.addEventListener("click", closeSetModal);
      setModalBack.addEventListener("click", (e) => {
        if(e.target === setModalBack) closeSetModal();
      });

      function setCardHtml(setUnit){
        if(!setUnit){
          return `
            <div class="setItem">
              <div class="emptyBox" style="width:64px;height:64px;border-radius:14px;">없음</div>
              <div class="sname">없음</div>
            </div>
          `;
        }
        return `
          <div class="setItem">
            <img src="${setUnit.image_url}" alt="${escapeHtml(setUnit.name)}">
            <div class="sname">${escapeHtml(setUnit.name)}</div>
          </div>
        `;
      }

      function openSetModal(atkUnit, setArr, setComment){
        if(!atkUnit){
          return;
        }
        setModalTitle.textContent = "세트 추천";
        const comment = (setComment ?? "").trim();

        setModalBody.innerHTML = `
          <div class="setTopUnit">
            <img class="uimg" src="${atkUnit.image_url}" alt="${escapeHtml(atkUnit.name)}">
            <div class="uname">${escapeHtml(atkUnit.name)}</div>
          </div>

          <div style="font-size:12px;font-weight:900;color:#111827;margin-top:8px;">추천 세트</div>
          <div class="setGrid">
            ${setCardHtml(setArr[0])}
            ${setCardHtml(setArr[1])}
            ${setCardHtml(setArr[2])}
          </div>

          <div class="setComment">
            <div class="title">세트 설명</div>
            <div class="text">${escapeHtml(comment || "없음")}</div>
          </div>
        `;
        setModalBack.style.display = "flex";
      }

      // =========================
      // ✅ 결과 카드 렌더링 (1~7 구조)
      // =========================
      function cellHtml(unit, clickIndex){
        if(!unit){
          return `
            <div class="cell">
              <div class="emptyBox">없음</div>
              <div class="cap">없음</div>
            </div>
          `;
        }

        // clickIndex가 숫자면 공격유닛으로 클릭 가능 처리
        const clickable = Number.isInteger(clickIndex);
        const cls = clickable ? "cell clickableUnit" : "cell";
        const dataAttr = clickable ? `data-atk-index="${clickIndex}"` : "";

        return `
          <div class="${cls}" ${dataAttr}>
            <img src="${unit.image_url}" alt="${escapeHtml(unit.name)}">
            <div class="cap">${escapeHtml(unit.name)}</div>
          </div>
        `;
      }

      function looksLikeUrl(v){
        const s = String(v ?? "").trim();
        return /^https?:\/\//i.test(s);
      }

      function renderSingleResult(){
        const total = RESULTS.length;
        const hasAny = total > 0;

        const idx = Math.min(Math.max(currentIndex, 0), Math.max(total - 1, 0));
        currentIndex = idx;

        const r = hasAny ? RESULTS[idx] : null;

        const atkArr = r ? r.atk : [null, null, null];
        const skArr  = r ? r.skill : [null, null, null];
        const pet    = r ? r.pet : null;

        const importantText = (r?.important ?? "").trim() || "없음";
        const formationsText = (r?.formations ?? "").trim() || "없음";
        const formationsComment = (r?.formations_comment ?? "").trim() || "없음";

        const firstText = r?.first ?? "없음";  // ✅ 기존 선/후 결과 유지 (5번: 공격순서)
        const badgeClass =
          firstText === "선공" ? "badge red" :
          firstText === "후공" ? "badge blue" :
          "badge gray";

        const pageLabel = hasAny ? `${idx+1} / ${total}` : `0 / 0`;

        // 진형 이미지: formations 값이 URL이면 이미지로도 보여줌
        const formationImgHtml = looksLikeUrl(r?.formations)
          ? `<img class="formationImg" src="${escapeHtml(r.formations)}" alt="formation">`
          : ``;

        resultBox.innerHTML = `
          <div class="resultToolbar">
            <div style="font-weight:900;color:#111827;">검색 결과</div>
            <div class="pager">
              <button class="pagerBtn" id="btnPrev" ${(!hasAny || idx===0) ? "disabled":""}>◀</button>
              <div class="pageInfo">${pageLabel}</div>
              <button class="pagerBtn" id="btnNext" ${(!hasAny || idx===total-1) ? "disabled":""}>▶</button>
            </div>
          </div>

          <div class="card">
            <!-- 1번 주요사항 -->
            <div class="importantBar">
              <div class="ico">⚠️</div>
              <div class="txt">주요사항: ${escapeHtml(importantText)}</div>
            </div>

            <div class="gridLayoutV2">
              <!-- 왼쪽: 2 / 4 / 7 -->
              <div class="stackCol">
                <div class="panel large">
                  <div class="panelTitle">공격유닛</div>
                  <div class="grid3">
                    ${cellHtml(atkArr[0], 0)}
                    ${cellHtml(atkArr[1], 1)}
                    ${cellHtml(atkArr[2], 2)}
                  </div>
                </div>

                <div class="panel large">
                  <div class="panelTitle">스킬순서</div>
                  <div class="grid3">
                    ${cellHtml(skArr[0])}
                    ${cellHtml(skArr[1])}
                    ${cellHtml(skArr[2])}
                  </div>
                </div>

                <div class="panel large">
                  <div class="panelTitle">진형설명</div>
                  <div class="textBox">${escapeHtml(formationsComment)}</div>
                </div>
              </div>

              <!-- 오른쪽: 3 / 5 / 6 -->
              <div class="stackCol">
                <div class="panel small centerCol">
                  <div class="panelTitle">추천 펫</div>
                  ${pet ? `
                    <div class="cell">
                      <img src="${pet.image_url}" alt="${escapeHtml(pet.name)}">
                      <div class="petName">${escapeHtml(pet.name)}</div>
                    </div>
                  ` : `
                    <div class="cell">
                      <div class="emptyBox">없음</div>
                      <div class="petName">없음</div>
                    </div>
                  `}
                </div>

                <div class="panel small centerCol">
                  <div class="panelTitle">공격순서</div>
                  <span class="${badgeClass}">${escapeHtml(firstText)}</span>
                </div>

                <div class="panel small centerCol">
                  <div class="panelTitle">진형추천</div>
                  <div class="formationWrap">
                    ${formationImgHtml}
                    <div class="formationTag">${escapeHtml(formationsText)}</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;

        // pager events
        const prevBtn = document.getElementById("btnPrev");
        const nextBtn = document.getElementById("btnNext");

        if(prevBtn) prevBtn.addEventListener("click", () => {
          if(currentIndex > 0){
            currentIndex--;
            renderSingleResult();
          }
        });
        if(nextBtn) nextBtn.addEventListener("click", () => {
          if(currentIndex < total - 1){
            currentIndex++;
            renderSingleResult();
          }
        });

        // ✅ 공격유닛 클릭 → 세트 모달
        // (현재 페이지 렌더된 DOM에서 클릭 대상만 바인딩)
        document.querySelectorAll(".clickableUnit").forEach(el => {
          el.addEventListener("click", () => {
            if(!hasAny) return;
            const i = Number(el.getAttribute("data-atk-index"));
            const rr = RESULTS[currentIndex];
            if(!rr) return;

            const atkUnit = rr.atk[i];
            const setArr = rr.atk_sets?.[i] || [null, null, null];
            const comment = rr.set_comment ?? "";
            openSetModal(atkUnit, setArr, comment);
          });
        });
      }

      document.getElementById("btnReset").addEventListener("click", () => {
        slots[0]=slots[1]=slots[2]=null;
        RESULTS = [];
        currentIndex = 0;
        renderSlots();
        updateResultHint();
      });

      document.getElementById("btnSearch").addEventListener("click", async () => {
        const selected = slots.filter(Boolean);
        if(selected.length < 3){
          alert("방어 유닛 3명을 먼저 선택해 주세요.");
          return;
        }

        const defKey = selected
          .map(s => s.id)
          .sort()
          .join("|");

        statusText.textContent = "검색중...";
        resultBox.textContent = "잠시만...";

        // ✅ 새 컬럼 포함 (important / formations / formations_comment / set columns)
        const { data: rows, error } = await supabaseClient
          .from("guild_war_results")
          .select([
            "result_id",
            "atk_1","atk_2","atk_3",
            "skill_1","skill_2","skill_3",
            "pet",
            "first",
            "def_key",
            "important",
            "formations",
            "formations_comment",
            "set_comment",
            "atk_1_set","atk_2_set","atk_3_set"
          ].join(", "))
          .eq("def_key", defKey)
          .order("result_id", { ascending: true });

        if(error){
          console.error(error);
          statusText.textContent = "에러";
          resultBox.textContent = "조회 실패(콘솔 확인)";
          return;
        }

        if(!rows || rows.length === 0){
          statusText.textContent = "결과 없음";
          RESULTS = [];
          currentIndex = 0;
          renderSingleResult();
          return;
        }

        // ✅ 결과에 필요한 id 모으기 (유닛/스킬/펫 + 세트까지)
        const ids = new Set();
        rows.forEach(r => {
          [r.atk_1,r.atk_2,r.atk_3,r.skill_1,r.skill_2,r.skill_3,r.pet,r.atk_1_set,r.atk_2_set,r.atk_3_set].forEach(x => {
            if(x) ids.add(x);
          });
        });

        const { data: unitRows, error: unitErr } = await supabaseClient
          .from("units")
          .select("id, name, image_url, kind")
          .in("id", Array.from(ids));

        if(unitErr) console.error(unitErr);

        const unitMap = new Map((unitRows || []).map(u => [u.id, u]));

        RESULTS = rows.map(r => {
          const atk = [r.atk_1, r.atk_2, r.atk_3].map(id => unitMap.get(id) || null);
          const skill = [r.skill_1, r.skill_2, r.skill_3].map(id => unitMap.get(id) || null);
          const pet = unitMap.get(r.pet) || null;

          // ✅ 각 공격유닛별 추천 세트 (각 1개씩 매핑: atk_1_set은 1번 유닛용)
          // 요구가 "atk_1_set/2/3 = 모달에 표시할 세트(값은 u###, kind=set)" 이라서
          // 현재는 각 슬롯당 1개 set을 넣고, 나머지는 없음 처리.
          // (나중에 3개 세트를 각각 넣고 싶으면 컬럼을 9개로 늘리면 여기만 확장하면 됨)
          const s1 = unitMap.get(r.atk_1_set) || null;
          const s2 = unitMap.get(r.atk_2_set) || null;
          const s3 = unitMap.get(r.atk_3_set) || null;

          const atk_sets = [
            [s1, null, null],
            [s2, null, null],
            [s3, null, null],
          ];

          return {
            result_id: r.result_id,
            first: r.first ?? "없음",
            important: r.important ?? "",
            formations: r.formations ?? "",
            formations_comment: r.formations_comment ?? "",
            set_comment: r.set_comment ?? "",
            atk,
            skill,
            pet,
            atk_sets
          };
        });

        currentIndex = 0;
        statusText.textContent = `결과 ${RESULTS.length}개`;
        renderSingleResult();
      });

      searchInput.addEventListener("input", () => {
        const q = searchInput.value.trim().toLowerCase();
        if(!q){
          renderUnitList(UNITS);
          return;
        }
        const filtered = UNITS.filter(u => (u.name || "").toLowerCase().includes(q));
        renderUnitList(filtered);
      });

      async function loadUnits(){
        statusText.textContent = "유닛 로딩중...";
        const { data, error } = await supabaseClient
          .from("units")
          .select("id, name, image_url")
          .eq("kind", "unit")
          .order("name", { ascending: true });

        if(error){
          console.error(error);
          statusText.textContent = "유닛 로드 실패";
          resultBox.textContent = "유닛을 불러오지 못했습니다. (RLS/정책 또는 컬럼 확인)";
          return;
        }

        UNITS = (data || []).map(u => ({
          id: u.id,
          name: u.name,
          image_url: u.image_url
        }));

        statusText.textContent = `유닛 ${UNITS.length}개 로드됨`;
        updateResultHint();
      }

      // 초기 실행
      renderSlots();
      updateResultHint();
      loadUnits();
    }
  </script>
</body>
</html>
