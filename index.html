<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>길드전</title>

  <style>
    :root{
      --bg:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --blue:#3b82f6;
      --sky:#bfe2ff;
      --card:#ffffff;
    }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap{
      max-width: 420px;
      margin: 0 auto;
      padding: 18px 16px 28px;
    }

    h1{
      margin: 4px 0 6px;
      font-size: 22px;
      text-align:center;
    }

    .desc{
      margin: 0 0 14px;
      font-size: 13px;
      color: var(--muted);
      text-align:center;
      line-height:1.35;
    }

    .label{
      font-size: 13px;
      font-weight: 800;
      margin: 10px 0 10px;
    }

    /* ===== 상단 3칸 슬롯 ===== */
    .slots{
      display:flex;
      gap:12px;
      justify-content: space-between;
    }

    .slot{
      width: 110px;
      height: 92px;
      border: 2px dashed var(--line);
      border-radius: 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      position: relative;
      background: #fff;
      cursor: pointer;
      user-select:none;
    }

    .slot .plus{
      font-size: 26px;
      color: var(--blue);
      font-weight: 900;
      line-height:1;
    }

    .slot.filled{
      border-style: solid;
      border-color: #c7ddff;
    }

    .slot .thumb{
      width: 44px;
      height: 44px;
      border-radius: 10px;
      overflow:hidden;
      border: 1px solid var(--line);
      background:#f3f4f6;
    }
    .slot .thumb img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
    }

    .slot .name{
      position:absolute;
      left: 10px;
      right: 10px;
      bottom: 8px;
      font-size: 12px;
      font-weight: 800;
      text-align:center;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .slot .remove{
      position:absolute;
      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background:#fff;
      font-weight: 900;
      cursor:pointer;
      display:none;
      line-height: 20px;
    }
    .slot.filled .remove{ display:block; }

    .btnRow{
      display:flex;
      gap:12px;
      margin-top: 14px;
    }

    .btn{
      flex:1;
      height: 44px;
      border-radius: 10px;
      border: 1px solid #dbeafe;
      background:#fff;
      font-weight: 800;
      cursor:pointer;
    }
    .btn.primary{
      background: var(--sky);
      border-color: #93c5fd;
    }

    .resultHead{
      margin-top: 18px;
      display:flex;
      justify-content: space-between;
      align-items:center;
      font-weight: 900;
      font-size: 13px;
    }
    .resultHead .right{
      color: var(--muted);
      font-weight: 700;
      font-size: 12px;
    }

    .resultBox{
      margin-top: 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      min-height: 54px;
      font-size: 13px;
      color: var(--muted);
      background:#fff;
    }

    /* ===== 옵션A: 페이저 ===== */
    .resultToolbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:10px;
    }

    .pager{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .pagerBtn{
      height:32px;
      min-width:38px;
      border-radius:10px;
      border:1px solid #dbeafe;
      background:#fff;
      font-weight:900;
      cursor:pointer;
    }
    .pagerBtn:disabled{
      opacity:.45;
      cursor:not-allowed;
    }

    .pageInfo{
      font-size:12px;
      font-weight:800;
      color:#374151;
      min-width:70px;
      text-align:center;
    }

    /* ===== 결과 카드 UI ===== */
    .card{
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
      background: var(--card);
      color: var(--text);
    }

    .gridLayout{
      display:grid;
      grid-template-columns: 1fr 104px;
      gap:12px;
      align-items:stretch;
    }

    .panel{
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px;
      background:#fff;
    }

    .panelTitle{
      font-size:12px;
      font-weight:900;
      color:#111827;
      margin-bottom:8px;
    }

    .grid3{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:8px;
    }

    .cell{
      text-align:center;
      min-width:0;
    }

    .cell img{
      width:48px;
      height:48px;
      border-radius:14px;
      object-fit:cover;
      border:1px solid rgba(0,0,0,.06);
      background:#f3f4f6;
      display:block;
      margin:0 auto;
    }

    .cap{
      margin-top:4px;
      font-size:11px;
      font-weight:800;
      color:#374151;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .emptyBox{
      width:48px;
      height:48px;
      border-radius:14px;
      background:#f3f4f6;
      border:1px solid rgba(0,0,0,.06);
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#9ca3af;
      font-weight:900;
      font-size:11px;
    }

    .centerCol{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      text-align:center;
    }

    .centerCol .panelTitle{
      width:100%;
      text-align:center;
      margin-bottom:10px;
    }

    .petName{
      margin-top:6px;
      font-size:11px;
      font-weight:900;
      color:#111827;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      width:100%;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      height:26px;
      padding:0 10px;
      border-radius:999px;
      font-weight:900;
      font-size:12px;
      color:#fff;
      margin-top:6px;
    }
    .badge.red{ background:#ef4444; }
    .badge.blue{ background:#3b82f6; }
    .badge.gray{ background:#9ca3af; }

    .notePanel{
      grid-column: 1 / -1;
    }

    .noteHead{
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:6px;
      color:#1e5aa8;
      font-weight:900;
      font-size:12px;
    }

    .noteText{
      white-space: pre-wrap;
      font-size:12px;
      line-height:1.4;
      max-height: 4.2em;
      overflow-y:auto;
      padding-right:6px;
      color:#111827;
    }

    /* ===== modal ===== */
    .modalBack{
      position: fixed;
      inset: 0;
      background: rgba(17,24,39,.45);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 16px;
      z-index: 9999;
    }
    .modal{
      position:relative;
      z-index:10000;
      width: 100%;
      max-width: 420px;
      background:#fff;
      border-radius: 14px;
      overflow:hidden;
      border: 1px solid var(--line);
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
    }
    .modalHeader{
      display:flex;
      align-items:center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background:#fff;
    }
    .modalHeader .title{
      font-weight: 900;
      font-size: 14px;
    }
    .modalHeader .close{
      border:1px solid var(--line);
      background:#fff;
      border-radius: 10px;
      padding: 6px 10px;
      cursor:pointer;
      font-weight:900;
    }
    .search{
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background:#fff;
    }
    .search input{
      width:100%;
      height: 42px;
      border-radius: 10px;
      border: 1px solid #dbeafe;
      padding: 0 12px;
      font-size: 14px;
      outline:none;
    }

    #unitList{
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding: 14px 14px 16px;
      max-height: 420px;
      overflow:auto;
      background:#fff;
    }

    #unitList .item{
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 10px 8px;
      border-radius: 14px;
      border: 1px solid #e8eef7;
      background: #fff;
      cursor: pointer;
    }

    #unitList .item:hover{
      border-color:#93c5fd;
      background:#f8fbff;
    }

    #unitList .thumb{
      width: 64px;
      height: 64px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      background:#f3f4f6;
    }
    #unitList .thumb img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
    }

    #unitList .name{
      font-weight: 800;
      font-size: 12px;
      line-height: 1.15;
      letter-spacing: -0.2px;
      text-align: center;
      word-break: keep-all;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      color:#111827;
    }

    .hint{
      padding: 10px 12px 14px;
      color: var(--muted);
      font-size: 12px;
      border-top: 1px dashed var(--line);
      background:#fff;
    }

    @media (max-width: 360px){
      .gridLayout{ grid-template-columns: 1fr 96px; }
      .cell img, .emptyBox{ width:46px; height:46px; }
      .cap{ font-size:10.5px; }
      .petName{ font-size:10.5px; }
    }
  </style>
</head>

<body>
  <!-- ✅ 로그인 UI (추가) -->
  <div id="loginBox" style="max-width:520px;margin:16px auto;padding:16px;border:1px solid #eaeaea;border-radius:12px;">
    <h3 style="margin:0 0 10px;">이메일 인증 로그인</h3>

    <div style="margin:8px 0;">
      <div style="font-size:12px;color:#555;margin-bottom:6px;">이메일</div>
      <input id="email" type="email" placeholder="example@naver.com" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;">
    </div>

    <div style="margin:8px 0;">
      <div style="font-size:12px;color:#555;margin-bottom:6px;">닉네임</div>
      <input id="nickname" type="text" placeholder="길드 닉네임" maxlength="20" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;">
    </div>

    <button id="sendBtn" style="width:100%;padding:12px;border:0;border-radius:10px;background:#3B82F6;color:white;font-weight:700;cursor:pointer;">
      인증 메일 보내기
    </button>

    <div id="loginMsg" style="margin-top:10px;font-size:13px;color:#666;"></div>
  </div>

  <!-- ✅ 차단 UI (추가) -->
  <div id="blockedBox" style="display:none;max-width:520px;margin:16px auto;padding:16px;border:1px solid #ffd4d4;border-radius:12px;background:#fff5f5;">
    <h3 style="margin:0 0 10px;color:#c00;">접근 불가</h3>
    <div style="font-size:13px;color:#900;">길드 권한이 없습니다. (status가 active가 아님)</div>
  </div>

  <div class="wrap">
    <h1>길드전</h1>
    <p class="desc">방어 유닛 3명을 선택하면 해당 구성에 대한 결과를 조회합니다</p>

    <div class="label">방어 유닛 선택</div>

    <div class="slots">
      <div class="slot" data-slot="0" aria-label="slot 1">
        <div class="plus">+</div>
        <button class="remove" title="제거" aria-label="remove 1">×</button>
      </div>

      <div class="slot" data-slot="1" aria-label="slot 2">
        <div class="plus">+</div>
        <button class="remove" title="제거" aria-label="remove 2">×</button>
      </div>

      <div class="slot" data-slot="2" aria-label="slot 3">
        <div class="plus">+</div>
        <button class="remove" title="제거" aria-label="remove 3">×</button>
      </div>
    </div>

    <div class="btnRow">
      <button class="btn" id="btnReset">초기화</button>
      <button class="btn primary" id="btnSearch">검색</button>
    </div>

    <div class="resultHead">
      <div class="left">결과</div>
      <div class="right" id="statusText">검색 전</div>
    </div>

    <div class="resultBox" id="resultBox">방어 유닛 3명을 선택해 주세요</div>
  </div>

  <!-- modal -->
  <div class="modalBack" id="modalBack" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modalHeader">
        <div class="title">유닛 선택</div>
        <button class="close" id="btnClose" aria-label="닫기">닫기</button>
      </div>
      <div class="search">
        <input id="searchInput" placeholder="이름 검색 (예: 루디)" />
      </div>
      <div id="unitList"></div>
      <div class="hint">유닛을 선택하고 방어 3명을 채운 뒤 검색하세요.</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // =========================================================
    // ✅ 0) 사이트 URL (메일 인증 복귀 주소) - 반드시 먼저 선언
    // =========================================================
    const SITE_URL = "https://llllssss1005-lgtm.github.io/guild-war-ui/";

    // =========================================================
    // ✅ 1) Supabase 연결
    // =========================================================
    const SUPABASE_URL = "https://rtlkthadgfyszawgbevk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Vsr12aXc5r8kCnjBnpvrcQ_4Enqbi3F";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    detectSessionInUrl: true,  // ✅ #access_token 읽어서 세션 저장
    persistSession: true,      // ✅ localStorage에 저장
    autoRefreshToken: true
  }
});


    // =========================================================
    // ✅ 2) RLS 대응: 로그인/권한 확인 로직 (정리본)
    // =========================================================

    // 이메일 인증 메일 보내기 (닉네임 포함)
    async function sendLoginEmail(email, nickname) {
      if (!email || !nickname) {
        alert("이메일과 닉네임을 입력해줘.");
        throw new Error("email/nickname required");
      }

      localStorage.setItem("pending_nickname", nickname.trim());

      const { error } = await supabaseClient.auth.signInWithOtp({
  email: email.trim(),
  options: {
    emailRedirectTo: SITE_URL
  },
});


      if (error) {
        console.error(error);
        throw error;
      }

      alert("인증 메일을 보냈어! 메일에서 링크를 눌러줘.");
    }

    // members 자동 생성 + active 판정
    async function ensureMemberRow() {
      const { data: { user }, error: userErr } = await supabaseClient.auth.getUser();
      if (userErr) throw userErr;
      if (!user) return { ok: false, reason: "not_logged_in" };

      const pendingNickname = (localStorage.getItem("pending_nickname") || "").trim();

      // 신규면 members row 생성 시도(중복이면 무시)
      if (pendingNickname) {
        const { error: upErr } = await supabaseClient
          .from("members")
          .upsert(
            {
              id: user.id,
              email: user.email,
              nickname: pendingNickname,
              status: "active",
            },
            {
              onConflict: "id"
            }
          );

        if (upErr) throw upErr;
        localStorage.removeItem("pending_nickname");
      }

      // 🔑 active 여부는 DB 함수로 확정 판정
      const { data: isActive, error: rpcErr } = await supabaseClient.rpc("is_active_member");
      if (rpcErr) throw rpcErr;
      if (!isActive) return { ok: false, reason: "not_active" };

      // active면 members row 조회 가능
      const { data: row, error: selErr } = await supabaseClient
        .from("members")
        .select("id, email, nickname, status")
        .eq("id", user.id)
        .single();

      if (selErr) throw selErr;
      return { ok: true, row };
    }

    // ✅ 권한 체크 결과에 따라 UI 표시
    const sendBtn = document.getElementById("sendBtn");
    const loginMsg = document.getElementById("loginMsg");
    const loginBox = document.getElementById("loginBox");
    const blockedBox = document.getElementById("blockedBox");

    async function renderGate() {
      try {
        const res = await ensureMemberRow();

        // 로그인 안 됨 → 로그인 박스
        if (!res.ok && res.reason === "not_logged_in") {
          if (loginBox) loginBox.style.display = "block";
          if (blockedBox) blockedBox.style.display = "none";
          return;
        }

        // 차단 → 차단 박스
        if (!res.ok && res.reason === "not_active") {
          if (loginBox) loginBox.style.display = "none";
          if (blockedBox) blockedBox.style.display = "block";
          return;
        }

        // active → 둘 다 숨김
        if (res.ok) {
          if (loginBox) loginBox.style.display = "none";
          if (blockedBox) blockedBox.style.display = "none";
          console.log("ACTIVE OK:", res.row);
        }
      } catch (e) {
        console.error(e);
        // 문제가 생기면 로그아웃 유도
        try { await supabaseClient.auth.signOut(); } catch(_) {}
      }
    }

    // 버튼 연결
    if (sendBtn) {
      sendBtn.addEventListener("click", async () => {
        try {
          loginMsg.textContent = "인증 메일 보내는 중...";
          await sendLoginEmail(
            document.getElementById("email").value,
            document.getElementById("nickname").value
          );
          loginMsg.textContent = "메일 보냈어! 받은 편지함에서 링크를 눌러줘 ✅";
        } catch (e) {
          console.error(e);
          loginMsg.textContent = "실패: " + (e?.message || e);
        }
      });
    }

    // 최초 1회 + 상태변경 감지(중복 호출 제거)
    renderGate();
supabaseClient.auth.onAuthStateChange((event) => {
  // ✅ 세션 복원/로그인 완료 시점에만 게이트 실행
  if (event === "INITIAL_SESSION" || event === "SIGNED_IN" || event === "TOKEN_REFRESHED") {
    renderGate();
  }
});

// ✅ 혹시 INITIAL_SESSION이 안 오거나 타이밍 꼬일 때를 대비한 안전장치(한 번만)
setTimeout(() => renderGate(), 400);


    // =========================================================
    // ✅ 3) 기존 길드전 코드(그대로)
    // =========================================================
    const slots = [null, null, null];
    let activeSlotIndex = 0;

    let UNITS = [];
    let RESULTS = [];
    let currentIndex = 0;

    const modalBack = document.getElementById("modalBack");
    const unitListEl = document.getElementById("unitList");
    const searchInput = document.getElementById("searchInput");
    const statusText = document.getElementById("statusText");
    const resultBox = document.getElementById("resultBox");

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderSlots(){
      document.querySelectorAll(".slot").forEach((el) => {
        const idx = Number(el.dataset.slot);
        const s = slots[idx];

        el.classList.toggle("filled", !!s);
        el.innerHTML = "";

        const rm = document.createElement("button");
        rm.className = "remove";
        rm.title = "제거";
        rm.textContent = "×";
        rm.addEventListener("click", (e) => {
          e.stopPropagation();
          clearSlot(idx);
        });
        el.appendChild(rm);

        if(!s){
          const plus = document.createElement("div");
          plus.className = "plus";
          plus.textContent = "+";
          el.appendChild(plus);
          return;
        }

        const thumb = document.createElement("div");
        thumb.className = "thumb";
        const img = document.createElement("img");
        img.src = s.image_url;
        img.alt = s.name;
        thumb.appendChild(img);

        const nm = document.createElement("div");
        nm.className = "name";
        nm.textContent = s.name;

        el.appendChild(thumb);
        el.appendChild(nm);
      });
    }

    function updateResultHint(){
      const chosen = slots.filter(Boolean);
      if(chosen.length < 3){
        statusText.textContent = "검색 전";
        resultBox.textContent = "방어 유닛 3명을 선택해 주세요";
        RESULTS = [];
        currentIndex = 0;
        return;
      }
      statusText.textContent = "준비됨";
      resultBox.textContent = `선택됨: ${chosen.map(x=>x.name).join(", ")}`;
    }

    function renderUnitList(list){
      unitListEl.innerHTML = "";
      list.forEach((u) => {
        const row = document.createElement("div");
        row.className = "item";
        row.innerHTML = `
          <div class="thumb"><img src="${u.image_url}" alt="${escapeHtml(u.name)}"></div>
          <div class="name">${escapeHtml(u.name)}</div>
        `;
        row.addEventListener("click", () => {
          setSlot(activeSlotIndex, u);
          closeModal();
        });
        unitListEl.appendChild(row);
      });

      if(list.length === 0){
        unitListEl.innerHTML = `<div style="padding:14px;color:#6b7280;font-size:13px;">검색 결과가 없습니다</div>`;
      }
    }

    function setSlot(i, unit){
      const already = slots.findIndex(s => s && s.name === unit.name);
      if(already !== -1 && already !== i){
        alert("이미 선택된 유닛입니다.");
        return;
      }
      slots[i] = { id: unit.id, name: unit.name, image_url: unit.image_url };
      renderSlots();
      updateResultHint();
    }

    function clearSlot(i){
      slots[i] = null;
      renderSlots();
      updateResultHint();
    }

    function openModal(slotIndex){
      activeSlotIndex = slotIndex;
      modalBack.style.display = "flex";
      searchInput.value = "";
      renderUnitList(UNITS);
      setTimeout(() => searchInput.focus({ preventScroll:true }), 50);
    }
    function closeModal(){
      modalBack.style.display = "none";
    }

    document.getElementById("btnClose").addEventListener("click", closeModal);
    modalBack.addEventListener("click", (e) => {
      if(e.target === modalBack) closeModal();
    });
    document.querySelectorAll(".slot").forEach((el) => {
      el.addEventListener("click", () => openModal(Number(el.dataset.slot)));
    });

    function cellHtml(unit){
      if(!unit){
        return `
          <div class="cell">
            <div class="emptyBox">없음</div>
            <div class="cap">없음</div>
          </div>
        `;
      }
      return `
        <div class="cell">
          <img src="${unit.image_url}" alt="${escapeHtml(unit.name)}">
          <div class="cap">${escapeHtml(unit.name)}</div>
        </div>
      `;
    }

    function renderSingleResult(){
      const total = RESULTS.length;
      const hasAny = total > 0;

      const idx = Math.min(Math.max(currentIndex, 0), Math.max(total - 1, 0));
      currentIndex = idx;

      const r = hasAny ? RESULTS[idx] : null;

      const atkArr = r ? r.atk : [null, null, null];
      const skArr  = r ? r.skill : [null, null, null];
      const pet    = r ? r.pet : null;

      const firstText = r?.first ?? "없음";
      const badgeClass =
        firstText === "선공" ? "badge red" :
        firstText === "후공" ? "badge blue" :
        "badge gray";

      const noteText = (r?.note ?? "").trim();
      const pageLabel = hasAny ? `${idx+1} / ${total}` : `0 / 0`;

      resultBox.innerHTML = `
        <div class="resultToolbar">
          <div style="font-weight:900;color:#111827;">검색 결과</div>
          <div class="pager">
            <button class="pagerBtn" id="btnPrev" ${(!hasAny || idx===0) ? "disabled":""}>◀</button>
            <div class="pageInfo">${pageLabel}</div>
            <button class="pagerBtn" id="btnNext" ${(!hasAny || idx===total-1) ? "disabled":""}>▶</button>
          </div>
        </div>

        <div class="card">
          <div class="gridLayout">
            <div class="panel">
              <div class="panelTitle">공격 유닛</div>
              <div class="grid3">
                ${cellHtml(atkArr[0])}
                ${cellHtml(atkArr[1])}
                ${cellHtml(atkArr[2])}
              </div>
            </div>

            <div class="panel centerCol">
              <div class="panelTitle">추천 펫</div>
              ${pet ? `
                <div class="cell">
                  <img src="${pet.image_url}" alt="${escapeHtml(pet.name)}">
                  <div class="petName">${escapeHtml(pet.name)}</div>
                </div>
              ` : `
                <div class="cell">
                  <div class="emptyBox">없음</div>
                  <div class="petName">없음</div>
                </div>
              `}
            </div>

            <div class="panel">
              <div class="panelTitle">스킬 순서</div>
              <div class="grid3">
                ${cellHtml(skArr[0])}
                ${cellHtml(skArr[1])}
                ${cellHtml(skArr[2])}
              </div>
            </div>

            <div class="panel centerCol">
              <div class="panelTitle">선 / 후</div>
              <span class="${badgeClass}">${escapeHtml(firstText)}</span>
            </div>

            <div class="panel notePanel">
              <div class="noteHead">📌 노트</div>
              <div class="noteText">${escapeHtml(noteText || "없음")}</div>
            </div>
          </div>
        </div>
      `;

      const prevBtn = document.getElementById("btnPrev");
      const nextBtn = document.getElementById("btnNext");

      if(prevBtn) prevBtn.addEventListener("click", () => {
        if(currentIndex > 0){
          currentIndex--;
          renderSingleResult();
        }
      });
      if(nextBtn) nextBtn.addEventListener("click", () => {
        if(currentIndex < total - 1){
          currentIndex++;
          renderSingleResult();
        }
      });
    }

    document.getElementById("btnReset").addEventListener("click", () => {
      slots[0]=slots[1]=slots[2]=null;
      RESULTS = [];
      currentIndex = 0;
      renderSlots();
      updateResultHint();
    });

    document.getElementById("btnSearch").addEventListener("click", async () => {
      const selected = slots.filter(Boolean);
      if(selected.length < 3){
        alert("방어 유닛 3명을 먼저 선택해 주세요.");
        return;
      }

      const defKey = selected
        .map(s => s.id)
        .sort()
        .join("|");

      statusText.textContent = "검색중...";
      resultBox.textContent = "잠시만...";

      const { data: rows, error } = await supabaseClient
        .from("guild_war_results")
        .select("result_id, atk_1, atk_2, atk_3, skill_1, skill_2, skill_3, pet, first, note, def_key")
        .eq("def_key", defKey)
        .order("result_id", { ascending: true });

      if(error){
        console.error(error);
        statusText.textContent = "에러";
        resultBox.textContent = "조회 실패(콘솔 확인)";
        return;
      }

      if(!rows || rows.length === 0){
        statusText.textContent = "결과 없음";
        RESULTS = [];
        currentIndex = 0;
        renderSingleResult();
        return;
      }

      const ids = new Set();
      rows.forEach(r => {
        [r.atk_1,r.atk_2,r.atk_3,r.skill_1,r.skill_2,r.skill_3,r.pet].forEach(x => {
          if(x) ids.add(x);
        });
      });

      const { data: unitRows, error: unitErr } = await supabaseClient
        .from("units")
        .select("id, name, image_url")
        .in("id", Array.from(ids));

      if(unitErr) console.error(unitErr);

      const unitMap = new Map((unitRows || []).map(u => [u.id, u]));

      RESULTS = rows.map(r => {
        const atk = [r.atk_1, r.atk_2, r.atk_3].map(id => unitMap.get(id) || null);
        const skill = [r.skill_1, r.skill_2, r.skill_3].map(id => unitMap.get(id) || null);
        const pet = unitMap.get(r.pet) || null;
        return {
          result_id: r.result_id,
          first: r.first ?? "없음",
          note: r.note ?? "",
          atk,
          skill,
          pet
        };
      });

      currentIndex = 0;
      statusText.textContent = `결과 ${RESULTS.length}개`;
      renderSingleResult();
    });

    searchInput.addEventListener("input", () => {
      const q = searchInput.value.trim().toLowerCase();
      if(!q){
        renderUnitList(UNITS);
        return;
      }
      const filtered = UNITS.filter(u => (u.name || "").toLowerCase().includes(q));
      renderUnitList(filtered);
    });

    async function loadUnits(){
      statusText.textContent = "유닛 로딩중...";
      const { data, error } = await supabaseClient
        .from("units")
        .select("id, name, image_url")
        .eq("kind", "unit")
        .order("name", { ascending: true });

      if(error){
        console.error(error);
        statusText.textContent = "유닛 로드 실패";
        resultBox.textContent = "유닛을 불러오지 못했습니다. (RLS/정책 또는 컬럼 확인)";
        return;
      }

      UNITS = (data || []).map(u => ({
        id: u.id,
        name: u.name,
        image_url: u.image_url
      }));

      statusText.textContent = `유닛 ${UNITS.length}개 로드됨`;
      updateResultHint();
    }

    renderSlots();
    updateResultHint();
    loadUnits();
  </script>
</body>
</html>
