<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>길드전</title>

  <style>
    :root{
      --bg:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --blue:#3b82f6;
      --sky:#bfe2ff;
      --card:#ffffff;
      --kakao:#FEE500;
      --kakaoText:#191600;
    }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap{
      max-width: 420px;
      margin: 0 auto;
      padding: 18px 16px 28px;
    }

    h1{
      margin: 4px 0 6px;
      font-size: 22px;
      text-align:center;
    }

    .desc{
      margin: 0 0 14px;
      font-size: 13px;
      color: var(--muted);
      text-align:center;
      line-height:1.35;
    }

    .label{
      font-size: 13px;
      font-weight: 800;
      margin: 10px 0 10px;
    }

    /* ===== 게이트(로그인) ===== */
    .gateWrap{
      max-width: 420px;
      margin: 0 auto;
      padding: 18px 16px 10px;
    }
    .gateCard{
      border:1px solid var(--line);
      border-radius:14px;
      background:#fff;
      padding:14px;
    }
    .gateTitle{
      font-weight: 900;
      font-size: 16px;
      margin: 0 0 6px;
      text-align:center;
    }
    .gateDesc{
      margin: 0 0 12px;
      font-size: 12px;
      color: var(--muted);
      text-align:center;
      line-height:1.4;
    }
    .gateBtn{
      width:100%;
      height: 44px;
      border-radius: 12px;
      border: 0;
      cursor:pointer;
      font-weight: 900;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }
    .gateBtn.kakao{
      background: var(--kakao);
      color: var(--kakaoText);
    }
    .kakaoBadge{
      width:22px;height:22px;
      border-radius:6px;
      background: rgba(0,0,0,.08);
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }
    .gateRow{
      display:flex;
      gap:10px;
      margin-top: 12px;
    }
    .gateRow > div{ flex:1; }
    .gateLabel{
      font-size: 12px;
      color: var(--muted);
      font-weight: 800;
      margin: 10px 0 6px;
    }
    .gateInput{
      width:100%;
      height: 42px;
      border-radius: 12px;
      border: 1px solid #dbeafe;
      padding: 0 12px;
      font-size: 14px;
      outline:none;
    }
    .gateInput:focus{
      border-color:#93c5fd;
      box-shadow: 0 0 0 4px rgba(59,130,246,.12);
    }
    .gateBtn.primary{
      margin-top: 12px;
      background: var(--sky);
      border: 1px solid #93c5fd;
      color: #0f172a;
    }
    .gateMsg{
      margin-top: 10px;
      font-size: 12px;
      color: #991b1b;
      font-weight: 900;
      display:none;
      background:#fee2e2;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #fecaca;
    }
    .gateHelp{
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      text-align:center;
    }
    .gateHelp a{
      color:#1d4ed8;
      font-weight: 900;
      text-decoration:none;
    }
    .gateHelp a:hover{ text-decoration:underline; }

    /* ===== 상단 3칸 슬롯 ===== */
    .slots{
      display:flex;
      gap:12px;
      justify-content: space-between;
    }

    .slot{
      width: 110px;
      height: 92px;
      border: 2px dashed var(--line);
      border-radius: 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      position: relative;
      background: #fff;
      cursor: pointer;
      user-select:none;
    }

    .slot .plus{
      font-size: 26px;
      color: var(--blue);
      font-weight: 900;
      line-height:1;
    }

    .slot.filled{
      border-style: solid;
      border-color: #c7ddff;
    }

    .slot .thumb{
      width: 44px;
      height: 44px;
      border-radius: 10px;
      overflow:hidden;
      border: 1px solid var(--line);
      background:#f3f4f6;
    }
    .slot .thumb img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
    }

    .slot .name{
      position:absolute;
      left: 10px;
      right: 10px;
      bottom: 8px;
      font-size: 12px;
      font-weight: 800;
      text-align:center;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .slot .remove{
      position:absolute;
      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background:#fff;
      font-weight: 900;
      cursor:pointer;
      display:none;
      line-height: 20px;
    }
    .slot.filled .remove{ display:block; }

    .btnRow{
      display:flex;
      gap:12px;
      margin-top: 14px;
    }

    .btn{
      flex:1;
      height: 44px;
      border-radius: 10px;
      border: 1px solid #dbeafe;
      background:#fff;
      font-weight: 800;
      cursor:pointer;
    }
    .btn.primary{
      background: var(--sky);
      border-color: #93c5fd;
    }

    .resultHead{
      margin-top: 18px;
      display:flex;
      justify-content: space-between;
      align-items:center;
      font-weight: 900;
      font-size: 13px;
    }
    .resultHead .right{
      color: var(--muted);
      font-weight: 700;
      font-size: 12px;
    }

    .resultBox{
      margin-top: 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      min-height: 54px;
      font-size: 13px;
      color: var(--muted);
      background:#fff;
    }

    /* ===== 옵션A: 페이저 ===== */
    .resultToolbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:10px;
    }

    .pager{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .pagerBtn{
      height:32px;
      min-width:38px;
      border-radius:10px;
      border:1px solid #dbeafe;
      background:#fff;
      font-weight:900;
      cursor:pointer;
    }
    .pagerBtn:disabled{
      opacity:.45;
      cursor:not-allowed;
    }

    .pageInfo{
      font-size:12px;
      font-weight:800;
      color:#374151;
      min-width:70px;
      text-align:center;
    }

    /* ===== 결과 카드 UI ===== */
    .card{
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
      background: var(--card);
      color: var(--text);
    }

    .gridLayout{
      display:grid;
      grid-template-columns: 1fr 104px;
      gap:12px;
      align-items:stretch;
    }

    .panel{
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px;
      background:#fff;
    }

    .panelTitle{
      font-size:12px;
      font-weight:900;
      color:#111827;
      margin-bottom:8px;
    }

    .grid3{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:8px;
    }

    .cell{
      text-align:center;
      min-width:0;
    }

    .cell img{
      width:48px;
      height:48px;
      border-radius:14px;
      object-fit:cover;
      border:1px solid rgba(0,0,0,.06);
      background:#f3f4f6;
      display:block;
      margin:0 auto;
    }

    .cap{
      margin-top:4px;
      font-size:11px;
      font-weight:800;
      color:#374151;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .emptyBox{
      width:48px;
      height:48px;
      border-radius:14px;
      background:#f3f4f6;
      border:1px solid rgba(0,0,0,.06);
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#9ca3af;
      font-weight:900;
      font-size:11px;
    }

    .centerCol{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      text-align:center;
    }

    .centerCol .panelTitle{
      width:100%;
      text-align:center;
      margin-bottom:10px;
    }

    .petName{
      margin-top:6px;
      font-size:11px;
      font-weight:900;
      color:#111827;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      width:100%;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      height:26px;
      padding:0 10px;
      border-radius:999px;
      font-weight:900;
      font-size:12px;
      color:#fff;
      margin-top:6px;
    }
    .badge.red{ background:#ef4444; }
    .badge.blue{ background:#3b82f6; }
    .badge.gray{ background:#9ca3af; }

    .notePanel{
      grid-column: 1 / -1;
    }

    .noteHead{
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:6px;
      color:#1e5aa8;
      font-weight:900;
      font-size:12px;
    }

    .noteText{
      white-space: pre-wrap;
      font-size:12px;
      line-height:1.4;
      max-height: 4.2em;
      overflow-y:auto;
      padding-right:6px;
      color:#111827;
    }

    /* ===== modal ===== */
    .modalBack{
      position: fixed;
      inset: 0;
      background: rgba(17,24,39,.45);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 16px;
      z-index: 9999;
    }
    .modal{
      position:relative;
      z-index:10000;
      width: 100%;
      max-width: 420px;
      background:#fff;
      border-radius: 14px;
      overflow:hidden;
      border: 1px solid var(--line);
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
    }
    .modalHeader{
      display:flex;
      align-items:center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background:#fff;
    }
    .modalHeader .title{
      font-weight: 900;
      font-size: 14px;
    }
    .modalHeader .close{
      border:1px solid var(--line);
      background:#fff;
      border-radius: 10px;
      padding: 6px 10px;
      cursor:pointer;
      font-weight:900;
    }
    .search{
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background:#fff;
    }
    .search input{
      width:100%;
      height: 42px;
      border-radius: 10px;
      border: 1px solid #dbeafe;
      padding: 0 12px;
      font-size: 14px;
      outline:none;
    }

    #unitList{
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding: 14px 14px 16px;
      max-height: 420px;
      overflow:auto;
      background:#fff;
    }

    #unitList .item{
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 10px 8px;
      border-radius: 14px;
      border: 1px solid #e8eef7;
      background: #fff;
      cursor: pointer;
    }

    #unitList .item:hover{
      border-color:#93c5fd;
      background:#f8fbff;
    }

    #unitList .thumb{
      width: 64px;
      height: 64px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      background:#f3f4f6;
    }
    #unitList .thumb img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
    }

    #unitList .name{
      font-weight: 800;
      font-size: 12px;
      line-height: 1.15;
      letter-spacing: -0.2px;
      text-align: center;
      word-break: keep-all;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      color:#111827;
    }

    .hint{
      padding: 10px 12px 14px;
      color: var(--muted);
      font-size: 12px;
      border-top: 1px dashed var(--line);
      background:#fff;
    }

    @media (max-width: 360px){
      .gridLayout{ grid-template-columns: 1fr 96px; }
      .cell img, .emptyBox{ width:46px; height:46px; }
      .cap{ font-size:10.5px; }
      .petName{ font-size:10.5px; }
    }
  </style>
</head>

<body>
  <!-- ✅ 1) 게이트 화면(추가) -->
  <div id="gate" class="gateWrap">
    <div class="gateCard">
      <div class="gateTitle">길드전 열람 코드 입력</div>
      <div class="gateDesc">
        먼저 카카오톡으로 연락해 <b>아이디 + 코드번호</b>를 받으세요.<br/>
        받은 뒤 아래에 입력하면 열람 가능합니다.
      </div>

      <button class="gateBtn kakao" id="btnKakao" type="button">
        <span class="kakaoBadge" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M12 3C6.477 3 2 6.582 2 11c0 2.74 1.77 5.15 4.5 6.62L5.8 21l4.03-2.2c.7.1 1.43.15 2.17.15 5.523 0 10-3.582 10-8s-4.477-8-10-8Z" fill="#191600" opacity=".92"/>
            <path d="M8.3 10.2h7.4M8.3 12.2h5.2" stroke="#FEE500" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </span>
        코드 받기 (카카오톡)
      </button>

      <div class="gateRow">
        <div>
          <div class="gateLabel">아이디 (1~40)</div>
          <input id="gateId" class="gateInput" inputmode="numeric" placeholder="예: 7" />
        </div>
        <div>
          <div class="gateLabel">코드번호 (1001~1040)</div>
          <input id="gateCode" class="gateInput" inputmode="numeric" placeholder="예: 1007" />
        </div>
      </div>

      <button class="gateBtn primary" id="btnGateEnter" type="button">확인</button>

      <div id="gateMsg" class="gateMsg"></div>

      <div class="gateHelp">
        문제가 있으면 <a href="https://open.kakao.com/o/smXJOCfi" target="_blank" rel="noopener">관리자에게 카카오톡으로 연락</a>해주세요.
      </div>
    </div>
  </div>

  <!-- ✅ 2) 기존 길드전 UI (그대로) -->
  <div id="app" class="wrap" style="display:none;">
    <h1>길드전</h1>
    <p class="desc">방어 유닛 3명을 선택하면 해당 구성에 대한 결과를 조회합니다</p>
