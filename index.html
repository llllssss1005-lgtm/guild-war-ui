<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>길드전</title>

  <!-- Supabase JS (UMD) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#ffffff;
      --panel:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --soft:#f3f4f6;
      --brand:#3b82f6;
      --brand2:#60a5fa;
      --danger:#ef4444;
      --shadow: 0 8px 20px rgba(0,0,0,.08);
      --radius: 16px;
      --radius2: 12px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Apple SD Gothic Neo", "Noto Sans KR", Arial, "맑은 고딕", sans-serif;
      color:var(--text);
      background: #f6f7fb;
    }
    .wrap{
      max-width: 980px;
      margin: 0 auto;
      padding: 22px 16px 40px;
    }
    header{
      text-align:center;
      margin: 10px 0 14px;
    }
    header h1{
      margin:0;
      font-size: 26px;
      letter-spacing:-0.5px;
    }
    header p{
      margin:6px 0 0;
      color:var(--muted);
      font-size: 13px;
    }

    .card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    /* Defense pick */
    .section-title{
      font-weight: 800;
      font-size: 14px;
      margin: 2px 0 10px;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .section-title .tag{
      font-weight:700;
      font-size: 12px;
      color:#2563eb;
      background:#dbeafe;
      padding:2px 8px;
      border-radius: 999px;
    }

    .def-row{
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .slot{
      border: 2px solid #cfe0ff;
      background:#f7fbff;
      border-radius: 14px;
      padding: 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      min-height: 78px;
      cursor:pointer;
      transition: transform .05s ease, border-color .12s ease;
    }
    .slot:hover{border-color:#93c5fd}
    .slot:active{transform: scale(.99)}
    .slot .left{
      display:flex;
      align-items:center;
      gap: 10px;
      min-width: 0;
    }
    .avatar{
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border:1px solid var(--line);
      background: #fff;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      flex: 0 0 auto;
    }
    .avatar img{width:100%;height:100%;object-fit:cover}
    .slot .name{
      font-weight: 800;
      font-size: 13px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 160px;
    }
    .slot .sub{
      font-size: 12px;
      color:var(--muted);
      margin-top: 2px;
    }
    .xbtn{
      width: 24px;
      height: 24px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 900;
      cursor:pointer;
      flex: 0 0 auto;
    }
    .xbtn:hover{background: #f9fafb}

    .actions{
      display:flex;
      gap: 10px;
      justify-content:center;
      margin-top: 6px;
    }
    button{
      border:0;
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 900;
      cursor:pointer;
      transition: transform .05s ease, opacity .12s ease;
    }
    button:active{transform: scale(.99)}
    .btn-ghost{
      background: #eff6ff;
      color:#1d4ed8;
      border: 1px solid #bfdbfe;
      min-width: 120px;
    }
    .btn-primary{
      background: #bfdbfe;
      color:#0f172a;
      border: 1px solid #93c5fd;
      min-width: 160px;
    }
    .btn-primary.enabled{
      background: var(--brand);
      color: #fff;
      border: 1px solid #2563eb;
    }
    .btn-primary:disabled{
      opacity: .45;
      cursor:not-allowed;
    }

    /* Results header */
    .results-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px dashed var(--line);
    }
    .results-header .left{
      display:flex; align-items:center; gap:8px;
      font-weight: 900;
    }
    .results-header .right{
      display:flex; align-items:center; gap:10px;
      color:var(--muted);
      font-size: 12px;
    }

    /* Result card (7 sections) */
    .result-shell{
      border: 2px solid #2563eb;
      border-radius: 14px;
      margin-top: 10px;
      padding: 10px;
      background: #fff;
    }
    .result-topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .result-topbar .title{
      font-weight: 900;
      font-size: 13px;
    }
    .pager{
      display:flex;
      align-items:center;
      gap: 10px;
      user-select:none;
    }
    .pager .pbtn{
      width: 28px;
      height: 28px;
      border-radius: 10px;
      border:1px solid var(--line);
      background:#fff;
      cursor:pointer;
      font-weight: 900;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .pager .pbtn:hover{background:#f9fafb}
    .pager .stat{
      font-weight: 900;
      font-size: 12px;
      min-width: 54px;
      text-align:center;
      color:#111827;
    }

    /* 1: important thin */
    .box1{
      border:2px solid var(--danger);
      border-radius: 12px;
      padding: 8px 10px;
      margin-bottom: 10px;
      display:flex;
      align-items:center;
      gap: 8px;
      background: #fff5f5;
    }
    .warn{
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: var(--danger);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 900;
      flex: 0 0 auto;
    }
    .box1 .txt{
      font-weight: 900;
      font-size: 13px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* Grid layout for 2~7 */
    .grid{
      display:grid;
      grid-template-columns: 1.45fr .85fr;
      gap: 10px;
    }
    .col{
      display:grid;
      grid-template-rows: auto auto auto;
      gap: 10px;
    }

    /* box base */
    .box{
      border: 2px solid #ef4444;
      border-radius: 12px;
      padding: 10px;
      background: #fff;
      min-height: 92px;
    }
    .box h3{
      margin:0 0 8px;
      font-size: 12px;
      font-weight: 1000;
      letter-spacing:-0.2px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 8px;
    }
    .box h3 .hint{
      font-size: 11px;
      color: var(--muted);
      font-weight: 800;
    }

    /* Size rules:
      Left column: 2,4,7 same height 느낌
      Right column: 3,5,6 same height 느낌
    */
    .box-247{min-height: 120px;}
    .box-356{min-height: 120px;}

    .row-icons{
      display:flex;
      gap: 10px;
      flex-wrap:wrap;
      align-items:flex-start;
    }
    .iconItem{
      width: 54px;
      text-align:center;
      cursor: default;
    }
    .iconItem.clickable{cursor:pointer}
    .iconItem .ico{
      width: 52px;
      height: 52px;
      border-radius: 14px;
      border:1px solid var(--line);
      background:#fff;
      overflow:hidden;
      margin: 0 auto 6px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .iconItem .ico img{width:100%;height:100%;object-fit:cover}
    .iconItem .lab{
      font-size: 11px;
      font-weight: 900;
      line-height: 1.15;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 7px 10px;
      border-radius: 999px;
      font-weight: 1000;
      font-size: 12px;
      border: 1px solid var(--line);
      background: var(--soft);
      color:#111827;
      white-space:nowrap;
    }

    .textArea{
      font-size: 12px;
      color:#111827;
      font-weight: 800;
      line-height: 1.35;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .muted{color:var(--muted)}
    .empty{
      color: var(--muted);
      font-weight: 900;
      font-size: 12px;
    }

    /* Picker modal */
    .overlay{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,.45);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 18px;
      z-index: 50;
    }
    .overlay.show{display:flex}
    .modal{
      width: min(920px, 96vw);
      max-height: 86vh;
      overflow:hidden;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 22px 60px rgba(0,0,0,.25);
      display:flex;
      flex-direction:column;
    }
    .modalHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 14px 14px;
      border-bottom: 1px solid var(--line);
      gap: 10px;
    }
    .modalHeader .mhLeft{
      display:flex;
      align-items:center;
      gap: 10px;
      min-width: 0;
    }
    .modalHeader .mhTitle{
      font-weight: 1000;
      font-size: 14px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .modalHeader .mhSub{
      font-size: 12px;
      color: var(--muted);
      font-weight: 800;
    }
    .modalHeader .mhClose{
      width: 34px; height: 34px;
      border-radius: 12px;
      border:1px solid var(--line);
      background:#fff;
      font-weight: 1000;
      cursor:pointer;
    }
    .modalBody{
      padding: 12px 14px;
      overflow:auto;
    }

    .searchbar{
      display:flex;
      gap: 10px;
      align-items:center;
      margin-bottom: 10px;
    }
    .searchbar input{
      width: 100%;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      outline:none;
      font-weight: 900;
      font-size: 13px;
      background:#fff;
    }
    .gridList{
      display:grid;
      grid-template-columns: repeat(6, minmax(0,1fr));
      gap: 10px;
    }
    @media (max-width: 860px){
      .grid{grid-template-columns: 1fr}
      .gridList{grid-template-columns: repeat(4, minmax(0,1fr));}
      .slot .name{max-width: 110px;}
    }
    @media (max-width: 520px){
      .gridList{grid-template-columns: repeat(3, minmax(0,1fr));}
      .iconItem{width: 52px;}
      .iconItem .ico{width: 50px;height:50px}
    }
    .pickCard{
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 8px;
      background:#fff;
      cursor:pointer;
      transition: transform .05s ease, border-color .12s ease;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap: 6px;
    }
    .pickCard:hover{border-color:#93c5fd}
    .pickCard:active{transform: scale(.99)}
    .pickCard .pimg{
      width: 60px; height: 60px;
      border-radius: 16px;
      border:1px solid var(--line);
      overflow:hidden;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .pickCard .pimg img{width:100%;height:100%;object-fit:cover}
    .pickCard .ptxt{
      font-size: 12px;
      font-weight: 1000;
      text-align:center;
      line-height: 1.15;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      width: 100%;
    }
    .toast{
      margin-top: 10px;
      font-size: 12px;
      font-weight: 900;
      color: var(--muted);
      text-align:center;
    }

    /* Set Modal content */
    .setModalTop{
      display:flex;
      align-items:center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .bigAvatar{
      width: 64px; height: 64px;
      border-radius: 18px;
      border:1px solid var(--line);
      overflow:hidden;
      background:#fff;
      flex: 0 0 auto;
      display:flex; align-items:center; justify-content:center;
    }
    .bigAvatar img{width:100%;height:100%;object-fit:cover}
    .setModalTop .info .nm{
      font-weight: 1000;
      font-size: 15px;
      margin: 0;
    }
    .setModalTop .info .sm{
      margin-top: 3px;
      color: var(--muted);
      font-weight: 900;
      font-size: 12px;
    }
    .setGrid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .setBox{
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background:#fff;
    }
    .setBox h4{
      margin:0 0 10px;
      font-size: 13px;
      font-weight: 1000;
    }
    .setRow{
      display:flex;
      gap: 10px;
      flex-wrap:wrap;
      align-items:flex-start;
    }
    .setChip{
      display:flex;
      align-items:center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background:#fff;
      min-width: 180px;
    }
    .setChip .simg{
      width: 40px; height: 40px;
      border-radius: 12px;
      border:1px solid var(--line);
      overflow:hidden;
      background:#fff;
      flex: 0 0 auto;
      display:flex; align-items:center; justify-content:center;
    }
    .setChip .simg img{width:100%;height:100%;object-fit:cover}
    .setChip .stxt{
      font-weight: 1000;
      font-size: 12px;
      line-height: 1.15;
    }
    .hr{height:1px;background:var(--line); margin: 12px 0;}
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <h1>길드전</h1>
      <p>방어 유닛 3명을 선택하면 해당 구성에 대한 결과를 조회합니다</p>
    </header>

    <div class="card">
      <div class="section-title">방어 유닛 선택 <span class="tag">3명</span></div>

      <div class="def-row">
        <div class="slot" data-slot="0">
          <div class="left">
            <div class="avatar" id="defAvatar0"></div>
            <div style="min-width:0">
              <div class="name" id="defName0">선택</div>
              <div class="sub" id="defSub0">터치/클릭해서 선택</div>
            </div>
          </div>
          <div class="xbtn" id="defClear0" title="삭제" style="display:none">×</div>
        </div>

        <div class="slot" data-slot="1">
          <div class="left">
            <div class="avatar" id="defAvatar1"></div>
            <div style="min-width:0">
              <div class="name" id="defName1">선택</div>
              <div class="sub" id="defSub1">터치/클릭해서 선택</div>
            </div>
          </div>
          <div class="xbtn" id="defClear1" title="삭제" style="display:none">×</div>
        </div>

        <div class="slot" data-slot="2">
          <div class="left">
            <div class="avatar" id="defAvatar2"></div>
            <div style="min-width:0">
              <div class="name" id="defName2">선택</div>
              <div class="sub" id="defSub2">터치/클릭해서 선택</div>
            </div>
          </div>
          <div class="xbtn" id="defClear2" title="삭제" style="display:none">×</div>
        </div>
      </div>

      <div class="actions">
        <button class="btn-ghost" id="btnReset">초기화</button>
        <button class="btn-primary" id="btnSearch" disabled>검색</button>
      </div>

      <div class="results-header">
        <div class="left">결과</div>
        <div class="right"><span id="resultCount">결과 0개</span></div>
      </div>

      <div id="resultArea"></div>
    </div>
  </div>

  <!-- Unit Picker Modal -->
  <div class="overlay" id="pickerOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modalHeader">
        <div class="mhLeft" style="min-width:0">
          <div>
            <div class="mhTitle" id="pickerTitle">유닛 선택</div>
            <div class="mhSub" id="pickerSub">클릭하면 해당 슬롯에 입력됩니다</div>
          </div>
        </div>
        <button class="mhClose" id="pickerClose" title="닫기">×</button>
      </div>
      <div class="modalBody">
        <div class="searchbar">
          <input id="pickerSearch" placeholder="유닛 이름 검색" autocomplete="off" />
        </div>
        <div class="gridList" id="pickerGrid"></div>
        <div class="toast" id="pickerToast"></div>
      </div>
    </div>
  </div>

  <!-- Set Modal (attack unit click) -->
  <div class="overlay" id="setOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modalHeader">
        <div class="mhLeft" style="min-width:0">
          <div>
            <div class="mhTitle" id="setTitle">세트 추천</div>
            <div class="mhSub" id="setSub">유닛별 추천 세트 & 설명</div>
          </div>
        </div>
        <button class="mhClose" id="setClose" title="닫기">×</button>
      </div>
      <div class="modalBody" id="setBody"></div>
    </div>
  </div>

  <script>
    /***********************
     * 1) Supabase 설정
     ***********************/
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const supabase = supabasejs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /***********************
     * 2) 전역 상태
     ***********************/
    let units = [];              // units table rows
    let unitMap = new Map();     // id => row
    let onlyUnits = [];          // kind === 'unit'

    let selectedDef = [null, null, null]; // u###
    let activeSlot = 0;

    let searchResults = [];      // guild_war_results matched rows
    let currentIndex = 0;

    /***********************
     * 3) 유틸
     ***********************/
    const $ = (sel) => document.querySelector(sel);

    function safeText(v){
      if (v === null || v === undefined) return "";
      return String(v);
    }
    function isEmpty(v){
      return safeText(v).trim().length === 0;
    }
    function normalizeId(v){
      const s = safeText(v).trim();
      return s || null;
    }
    function makeDefKey(a,b,c){
      const arr = [a,b,c].filter(Boolean).sort();
      return arr.join("|");
    }

    function renderAvatar(el, item){
      el.innerHTML = "";
      if (!item || !item.img){
        el.style.background = "#fff";
        el.textContent = "";
        return;
      }
      const img = document.createElement("img");
      img.src = item.img;
      img.alt = item.name || "";
      el.appendChild(img);
    }

    function setSlotUI(i, id){
      const nameEl = $("#defName"+i);
      const subEl  = $("#defSub"+i);
      const avEl   = $("#defAvatar"+i);
      const clr    = $("#defClear"+i);

      if (!id){
        nameEl.textContent = "선택";
        subEl.textContent  = "터치/클릭해서 선택";
        renderAvatar(avEl, null);
        clr.style.display = "none";
        return;
      }
      const item = unitMap.get(id);
      nameEl.textContent = item?.name || id;
      subEl.textContent  = id;
      renderAvatar(avEl, item);
      clr.style.display = "flex";
    }

    function updateSearchButton(){
      const ok = selectedDef.every(Boolean);
      const btn = $("#btnSearch");
      btn.disabled = !ok;
      btn.classList.toggle("enabled", ok);
    }

    function getUnit(id){
      return unitMap.get(id) || null;
    }

    function makeIconItem(id, clickable=false){
      const u = getUnit(id);
      const div = document.createElement("div");
      div.className = "iconItem" + (clickable ? " clickable" : "");

      const ico = document.createElement("div");
      ico.className = "ico";
      if (u?.img){
        const img = document.createElement("img");
        img.src = u.img;
        img.alt = u.name || "";
        ico.appendChild(img);
      }
      const lab = document.createElement("div");
      lab.className = "lab";
      lab.textContent = u?.name || (id ? id : "없음");

      div.appendChild(ico);
      div.appendChild(lab);
      return div;
    }

    function parseMaybeMultiIds(value){
      // 값이 "u100|u101" 이나 "u100, u101" 형태로 들어오면 분리해서 배열로 반환
      const s = safeText(value).trim();
      if (!s) return [];
      if (s.includes("|")) return s.split("|").map(v=>v.trim()).filter(Boolean);
      if (s.includes(",")) return s.split(",").map(v=>v.trim()).filter(Boolean);
      return [s];
    }

    /***********************
     * 4) 데이터 로드
     ***********************/
    async function loadUnits(){
      // 캐시 사용(있으면)
      const cacheKey = "vlrt_units_cache_v1";
      try{
        const cached = localStorage.getItem(cacheKey);
        if (cached){
          const parsed = JSON.parse(cached);
          if (Array.isArray(parsed) && parsed.length){
            units = parsed;
            rebuildUnitMap();
            return;
          }
        }
      }catch(e){}

      const { data, error } = await supabase
        .from("units")
        .select("*")
        .order("id", { ascending:true });

      if (error){
        console.error(error);
        alert("units 로드 실패: " + error.message);
        return;
      }
      units = data || [];
      try{ localStorage.setItem(cacheKey, JSON.stringify(units)); }catch(e){}
      rebuildUnitMap();
    }

    function rebuildUnitMap(){
      unitMap = new Map();
      for (const r of units){
        if (r?.id) unitMap.set(r.id, r);
      }
      onlyUnits = units.filter(r => (r?.kind || "").toLowerCase() === "unit");
    }

    /***********************
     * 5) 유닛 선택 Picker
     ***********************/
    function openPicker(slotIndex){
      activeSlot = slotIndex;
      $("#pickerTitle").textContent = `유닛 선택 (슬롯 ${slotIndex+1})`;
      $("#pickerSub").textContent = "클릭하면 해당 슬롯에 입력됩니다";
      $("#pickerSearch").value = "";
      renderPickerList("");
      $("#pickerOverlay").classList.add("show");
      $("#pickerOverlay").setAttribute("aria-hidden", "false");
      $("#pickerSearch").focus();
    }

    function closePicker(){
      $("#pickerOverlay").classList.remove("show");
      $("#pickerOverlay").setAttribute("aria-hidden", "true");
    }

    function renderPickerList(q){
      const grid = $("#pickerGrid");
      const toast = $("#pickerToast");
      grid.innerHTML = "";

      const query = (q || "").trim().toLowerCase();
      const list = onlyUnits.filter(u => {
        if (!query) return true;
        return safeText(u.name).toLowerCase().includes(query) || safeText(u.id).toLowerCase().includes(query);
      });

      toast.textContent = list.length ? `${list.length}개 표시 중` : "검색 결과가 없습니다";

      for (const u of list){
        const card = document.createElement("div");
        card.className = "pickCard";

        const imgWrap = document.createElement("div");
        imgWrap.className = "pimg";
        if (u.img){
          const img = document.createElement("img");
          img.src = u.img;
          img.alt = u.name || "";
          imgWrap.appendChild(img);
        }

        const txt = document.createElement("div");
        txt.className = "ptxt";
        txt.textContent = u.name || u.id;

        card.appendChild(imgWrap);
        card.appendChild(txt);

        card.addEventListener("click", () => {
          selectedDef[activeSlot] = u.id;
          setSlotUI(activeSlot, u.id);
          updateSearchButton();
          closePicker();
        });

        grid.appendChild(card);
      }
    }

    /***********************
     * 6) 검색
     ***********************/
    async function runSearch(){
      const a = selectedDef[0], b = selectedDef[1], c = selectedDef[2];
      const defKey = makeDefKey(a,b,c);

      $("#resultArea").innerHTML = "";
      $("#resultCount").textContent = "검색 중...";

      const { data, error } = await supabase
        .from("guild_war_results")
        .select("*")
        .eq("def_key", defKey)
        .order("id", { ascending:true });

      if (error){
        console.error(error);
        $("#resultCount").textContent = "결과 0개";
        alert("검색 실패: " + error.message);
        return;
      }

      searchResults = data || [];
      currentIndex = 0;
      $("#resultCount").textContent = `결과 ${searchResults.length}개`;

      renderResult();
    }

    function renderResult(){
      const area = $("#resultArea");
      area.innerHTML = "";

      if (!searchResults.length){
        const empty = document.createElement("div");
        empty.style.marginTop = "10px";
        empty.className = "empty";
        empty.textContent = "검색 결과가 없습니다";
        area.appendChild(empty);
        return;
      }

      const row = searchResults[currentIndex];

      const shell = document.createElement("div");
      shell.className = "result-shell";

      // Top bar
      const top = document.createElement("div");
      top.className = "result-topbar";

      const title = document.createElement("div");
      title.className = "title";
      title.textContent = "검색 결과";

      const pager = document.createElement("div");
      pager.className = "pager";

      const prev = document.createElement("div");
      prev.className = "pbtn";
      prev.textContent = "‹";
      prev.addEventListener("click", () => {
        if (currentIndex > 0){
          currentIndex--;
          renderResult();
        }
      });

      const stat = document.createElement("div");
      stat.className = "stat";
      stat.textContent = `${currentIndex+1} / ${searchResults.length}`;

      const next = document.createElement("div");
      next.className = "pbtn";
      next.textContent = "›";
      next.addEventListener("click", () => {
        if (currentIndex < searchResults.length-1){
          currentIndex++;
          renderResult();
        }
      });

      pager.appendChild(prev);
      pager.appendChild(stat);
      pager.appendChild(next);

      top.appendChild(title);
      top.appendChild(pager);
      shell.appendChild(top);

      // 1) important (always show, thin)
      const b1 = document.createElement("div");
      b1.className = "box1";

      const warn = document.createElement("div");
      warn.className = "warn";
      warn.textContent = "⚠";

      const t1 = document.createElement("div");
      t1.className = "txt";
      const imp = safeText(row.important).trim();
      t1.textContent = imp ? imp : "없음";

      b1.appendChild(warn);
      b1.appendChild(t1);
      shell.appendChild(b1);

      // Main grid
      const grid = document.createElement("div");
      grid.className = "grid";

      const leftCol = document.createElement("div");
      leftCol.className = "col";

      const rightCol = document.createElement("div");
      rightCol.className = "col";

      // 2) 공격유닛 (click -> set modal)
      const box2 = document.createElement("div");
      box2.className = "box box-247";
      const h2 = document.createElement("h3");
      h2.innerHTML = `<span>2번: 공격유닛</span><span class="hint">클릭 시 세트 모달</span>`;
      const row2 = document.createElement("div");
      row2.className = "row-icons";

      const atkIds = [row.atk_1, row.atk_2, row.atk_3].map(normalizeId);
      atkIds.forEach((id, idx) => {
        const item = makeIconItem(id, true);
        item.addEventListener("click", () => openSetModal(idx, row));
        row2.appendChild(item);
      });

      // 빈칸 방지
      if (atkIds.filter(Boolean).length === 0){
        const em = document.createElement("div");
        em.className = "empty";
        em.textContent = "없음";
        row2.appendChild(em);
      }

      box2.appendChild(h2);
      box2.appendChild(row2);

      // 4) 스킬순서
      const box4 = document.createElement("div");
      box4.className = "box box-247";
      const h4 = document.createElement("h3");
      h4.innerHTML = `<span>4번: 스킬순서</span>`;
      const row4 = document.createElement("div");
      row4.className = "row-icons";

      const skillIds = [row.skill_1, row.skill_2, row.skill_3].map(normalizeId);
      skillIds.forEach((id) => row4.appendChild(makeIconItem(id)));
      if (skillIds.filter(Boolean).length === 0){
        const em = document.createElement("div");
        em.className = "empty";
        em.textContent = "없음";
        row4.appendChild(em);
      }
      box4.appendChild(h4);
      box4.appendChild(row4);

      // 7) 진형설명 (text)
      const box7 = document.createElement("div");
      box7.className = "box box-247";
      const h7 = document.createElement("h3");
      h7.innerHTML = `<span>7번: 진형설명</span>`;
      const tx7 = document.createElement("div");
      tx7.className = "textArea";
      const fcom = safeText(row.formations_comment).trim();
      tx7.textContent = fcom ? fcom : "없음";

      box7.appendChild(h7);
      box7.appendChild(tx7);

      leftCol.appendChild(box2);
      leftCol.appendChild(box4);
      leftCol.appendChild(box7);

      // 3) 추천펫
      const box3 = document.createElement("div");
      box3.className = "box box-356";
      const h3 = document.createElement("h3");
      h3.innerHTML = `<span>3번: 추천 펫</span>`;
      const row3 = document.createElement("div");
      row3.className = "row-icons";

      const petIds = [row.pet_1, row.pet_2, row.pet_3].map(normalizeId);
      petIds.forEach((id) => row3.appendChild(makeIconItem(id)));
      if (petIds.filter(Boolean).length === 0){
        const em = document.createElement("div");
        em.className = "empty";
        em.textContent = "없음";
        row3.appendChild(em);
      }
      box3.appendChild(h3);
      box3.appendChild(row3);

      // 5) 공격순서 (기존 선/후 결과 유지)
      const box5 = document.createElement("div");
      box5.className = "box box-356";
      const h5 = document.createElement("h3");
      h5.innerHTML = `<span>5번: 공격순서</span>`;
      const row5 = document.createElement("div");

      // 기존 데이터 컬럼명이 프로젝트마다 달랐을 수 있어서, 여러 후보를 체크
      const orderValue =
        safeText(row.attack_order).trim() ||
        safeText(row.atk_order).trim() ||
        safeText(row.order).trim() ||
        safeText(row.first).trim() ||
        safeText(row.turn).trim();

      const pill = document.createElement("div");
      pill.className = "pill";
      pill.textContent = orderValue ? orderValue : "없음";
      row5.appendChild(pill);

      box5.appendChild(h5);
      box5.appendChild(row5);

      // 6) 진형추천 (formations + 이미지)
      const box6 = document.createElement("div");
      box6.className = "box box-356";
      const h6 = document.createElement("h3");
      h6.innerHTML = `<span>6번: 진형추천</span><span class="hint">기본/밸런스/공격/보호</span>`;
      const row6 = document.createElement("div");
      row6.className = "row-icons";

      // formations 값이 units(kind=formation)로 들어온다고 가정 (u###)
      const formationId = normalizeId(row.formations);
      if (formationId){
        row6.appendChild(makeIconItem(formationId));
      }else{
        const em = document.createElement("div");
        em.className = "empty";
        em.textContent = "없음";
        row6.appendChild(em);
      }

      box6.appendChild(h6);
      box6.appendChild(row6);

      rightCol.appendChild(box3);
      rightCol.appendChild(box5);
      rightCol.appendChild(box6);

      grid.appendChild(leftCol);
      grid.appendChild(rightCol);

      shell.appendChild(grid);
      area.appendChild(shell);
    }

    /***********************
     * 7) 세트 모달
     ***********************/
    function openSetModal(atkIndex, row){
      const atkId = normalizeId([row.atk_1, row.atk_2, row.atk_3][atkIndex]);
      const unit = getUnit(atkId);

      // 각 공격유닛별 추천 세트 컬럼
      const setCol = ["atk_1_set", "atk_2_set", "atk_3_set"][atkIndex];
      const setRaw = row[setCol];
      const setIds = parseMaybeMultiIds(setRaw);

      const setComment = safeText(row.set_comment).trim();

      $("#setTitle").textContent = "세트 추천";
      $("#setSub").textContent = `(${atkIndex+1}번 공격유닛)`;

      const body = $("#setBody");
      body.innerHTML = "";

      // Top
      const top = document.createElement("div");
      top.className = "setModalTop";

      const ba = document.createElement("div");
      ba.className = "bigAvatar";
      if (unit?.img){
        const img = document.createElement("img");
        img.src = unit.img;
        img.alt = unit.name || "";
        ba.appendChild(img);
      }

      const info = document.createElement("div");
      info.className = "info";
      const nm = document.createElement("div");
      nm.className = "nm";
      nm.textContent = unit?.name || (atkId || "없음");
      const sm = document.createElement("div");
      sm.className = "sm";
      sm.textContent = atkId ? `ID: ${atkId}` : "ID: 없음";

      info.appendChild(nm);
      info.appendChild(sm);

      top.appendChild(ba);
      top.appendChild(info);

      body.appendChild(top);

      // Set box
      const setBox = document.createElement("div");
      setBox.className = "setBox";
      const h4 = document.createElement("h4");
      h4.textContent = "추천 세트";
      setBox.appendChild(h4);

      const setRow = document.createElement("div");
      setRow.className = "setRow";

      if (setIds.length){
        for (const sid of setIds){
          const s = getUnit(sid); // kind=set
          const chip = document.createElement("div");
          chip.className = "setChip";

          const simg = document.createElement("div");
          simg.className = "simg";
          if (s?.img){
            const img = document.createElement("img");
            img.src = s.img;
            img.alt = s.name || "";
            simg.appendChild(img);
          }

          const stxt = document.createElement("div");
          stxt.className = "stxt";
          stxt.textContent = s?.name || sid;

          chip.appendChild(simg);
          chip.appendChild(stxt);
          setRow.appendChild(chip);
        }
      }else{
        const em = document.createElement("div");
        em.className = "empty";
        em.textContent = "없음";
        setRow.appendChild(em);
      }

      setBox.appendChild(setRow);
      body.appendChild(setBox);

      // Comment box
      const cBox = document.createElement("div");
      cBox.className = "setBox";
      const h5 = document.createElement("h4");
      h5.textContent = "세트 설명";
      cBox.appendChild(h5);

      const tx = document.createElement("div");
      tx.className = "textArea";
      tx.textContent = setComment ? setComment : "없음";
      cBox.appendChild(tx);

      body.appendChild(cBox);

      // open
      $("#setOverlay").classList.add("show");
      $("#setOverlay").setAttribute("aria-hidden", "false");
    }

    function closeSetModal(){
      $("#setOverlay").classList.remove("show");
      $("#setOverlay").setAttribute("aria-hidden", "true");
    }

    /***********************
     * 8) 이벤트 바인딩
     ***********************/
    function bindEvents(){
      // slot open picker
      document.querySelectorAll(".slot").forEach(slot => {
        slot.addEventListener("click", (e) => {
          // clear 버튼 누른 경우는 제외
          if (e.target && e.target.classList.contains("xbtn")) return;
          const idx = Number(slot.dataset.slot);
          openPicker(idx);
        });
      });

      // clear each
      [0,1,2].forEach(i => {
        $("#defClear"+i).addEventListener("click", (e) => {
          e.stopPropagation();
          selectedDef[i] = null;
          setSlotUI(i, null);
          updateSearchButton();
        });
      });

      // reset
      $("#btnReset").addEventListener("click", () => {
        selectedDef = [null,null,null];
        [0,1,2].forEach(i => setSlotUI(i, null));
        updateSearchButton();
        searchResults = [];
        currentIndex = 0;
        $("#resultCount").textContent = "결과 0개";
        $("#resultArea").innerHTML = "";
      });

      // search
      $("#btnSearch").addEventListener("click", runSearch);

      // picker close
      $("#pickerClose").addEventListener("click", closePicker);
      $("#pickerOverlay").addEventListener("click", (e) => {
        if (e.target === $("#pickerOverlay")) closePicker();
      });

      // picker search
      $("#pickerSearch").addEventListener("input", (e) => {
        renderPickerList(e.target.value);
      });

      // set modal close
      $("#setClose").addEventListener("click", closeSetModal);
      $("#setOverlay").addEventListener("click", (e) => {
        if (e.target === $("#setOverlay")) closeSetModal();
      });

      // esc close
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape"){
          closePicker();
          closeSetModal();
        }
      });
    }

    /***********************
     * 9) 초기화
     ***********************/
    async function init(){
      bindEvents();
      await loadUnits();

      // 초기 슬롯 UI
      [0,1,2].forEach(i => setSlotUI(i, null));
      updateSearchButton();

      // picker 기본 리스트
      renderPickerList("");
    }

    init();
  </script>
</body>
</html>
