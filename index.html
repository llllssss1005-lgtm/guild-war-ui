<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>길드전</title>

  <!-- ✅ CSS 파일 연결 -->
  <link rel="stylesheet" href="./assets/styles.css">
</head>

<body>
  <!-- ✅ 상단 고정 탭바 -->
  <div id="tabBar" class="tabBar" aria-label="navigation tabs">
    <div class="tabInner">
      <div class="tabs">
        <button class="tabBtn" id="tabSearch" type="button">길드전 검색</button>
        <button class="tabBtn" id="tabAtk" type="button">내 공격덱</button>
      </div>
      <div class="tabMini">
        <button class="miniBtn" id="btnHome" type="button" title="대문">홈</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- ✅ 1) 게이트 화면 -->
  <div id="gate" class="gateWrap">
    <div class="gateCard">
      <div class="gateTitle">VLRT길드 열람 코드 입력</div>

      <div class="gateDesc">
        먼저 카카오톡으로 연락해 <b>아이디 + 코드번호</b>를 받으세요.<br/>
        받은 뒤 아래에 입력하면 열람 가능합니다.
      </div>

      <button class="gateBtn kakao" id="btnKakao" type="button">
        <span class="kakaoBadge" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M12 3C6.477 3 2 6.582 2 11c0 2.74 1.77 5.15 4.5 6.62L5.8 21l4.03-2.2c.7.1 1.43.15 2.17.15 5.523 0 10-3.582 10-8s-4.477-8-10-8Z" fill="#191600" opacity=".92"/>
            <path d="M8.3 10.2h7.4M8.3 12.2h5.2" stroke="#FEE500" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </span>
        코드 받기 (카카오톡)
      </button>

      <div class="gateRow">
        <div>
          <div class="gateLabel">아이디</div>
          <input id="gateId" class="gateInput" inputmode="numeric" placeholder="입력:" />
        </div>
        <div>
          <div class="gateLabel">코드</div>
          <input id="gateCode" class="gateInput" inputmode="numeric" placeholder="입력:" />
        </div>
      </div>

      <button class="gateBtn primary" id="btnGateEnter" type="button">확인</button>

      <div id="gateMsg" class="gateMsg"></div>

      <div class="gateHelp">
        문제가 있으면 <a href="https://open.kakao.com/o/smXJOCfi" target="_blank" rel="noopener">관리자에게 카카오톡으로 연락</a>해주세요.
      </div>
    </div>
  </div>

  <!-- ✅ 1.5) 대문(메인 메뉴) -->
  <div id="mainMenu" class="doorWrap" style="display:none;">
    <video class="doorVideo" autoplay muted playsinline loop>
      <source src="https://res.cloudinary.com/dsnso5ime/video/upload/v1772006338/kling_20260225_Image_to_Video____________4019_0_wpdspq.mp4" type="video/mp4">
    </video>

    <div class="doorDim"></div>

    <div class="doorContent">
      <img class="doorLogo"
           src="https://res.cloudinary.com/dsnso5ime/image/upload/v1772006337/ChatGPT_Image_2026%EB%85%84_2%EC%9B%94_25%EC%9D%BC_%EC%98%A4%ED%9B%84_03_45_15_aine2j.png"
           alt="VLRT">

      <div class="doorBtns">
        <button class="doorBtn primary" id="btnGoSearch">길드전 검색</button>
        <button class="doorBtn" id="btnGoAtk">내 공격덱</button>
      </div>
    </div>
  </div>

  <!-- ✅ 2) 길드전 검색 페이지 -->
  <div id="viewSearch" style="display:none;">
    <div id="app" class="wrap">
      <!-- TOP5 -->
      <div class="topSection">
        <div class="topLabel">실시간 검색 TOP5</div>

        <div class="topCard">
          <div class="topSliderWrap" id="topSliderWrap">
            <div class="topTrack" id="topTrack"></div>
          </div>
        </div>

        <div class="rankTableWrap" id="rankTableWrap">
          <div id="rankList"></div>
        </div>
      </div>

      <p class="desc">방어 유닛 3명을 선택하면 해당 구성에 대한 결과를 조회합니다</p>

      <div class="label">방어 유닛 선택</div>

      <div class="slots">
        <div class="slot" data-slot="0" aria-label="slot 1">
          <div class="plus">+</div>
          <button class="remove" title="제거" aria-label="remove 1" type="button">×</button>
        </div>

        <div class="slot" data-slot="1" aria-label="slot 2">
          <div class="plus">+</div>
          <button class="remove" title="제거" aria-label="remove 2" type="button">×</button>
        </div>

        <div class="slot" data-slot="2" aria-label="slot 3">
          <div class="plus">+</div>
          <button class="remove" title="제거" aria-label="remove 3" type="button">×</button>
        </div>
      </div>

      <div class="btnRow">
        <button class="btn" id="btnReset" type="button">초기화</button>
        <button class="btn primary" id="btnSearch" type="button">검색</button>
      </div>

      <div class="resultHead">
        <div class="left">결과</div>
        <div class="right" id="statusText">검색 전</div>
      </div>

      <div class="resultBox" id="resultBox">방어 유닛 3명을 선택해 주세요</div>
    </div>
  </div>

  <!-- ✅ 3) 내 공격덱 페이지 -->
  <div id="viewAtk" style="display:none;">
    <div class="wrap">
      <div class="atkHead">
        <div class="atkTitle">내 공격덱</div>
        <div style="font-size:12px;font-weight:900;color:#6b7280;">저장된 프리셋</div>
      </div>

      <p class="atkHint">
        길드전 검색 결과에서 <b>+저장</b>을 누르면 프리셋이 저장됩니다.<br/>
        ☆ 즐겨찾기는 위에 먼저 보여요.
      </p>

      <div id="presetList" class="presetList"></div>
    </div>
  </div>

  <!-- modal: 유닛 선택 -->
  <div class="modalBack" id="modalBack" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modalHeader">
        <div class="title">유닛 선택</div>
        <button class="close" id="btnClose" aria-label="닫기" type="button">닫기</button>
      </div>
      <div class="search">
        <input id="searchInput" placeholder="이름 검색 (예: 루디)" />
      </div>
      <div id="unitList"></div>
      <div class="hint">유닛을 선택하고 방어 3명을 채운 뒤 검색하세요.</div>
    </div>
  </div>

  <!-- ✅ supabase 먼저 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ✅ 그 다음 app.js -->
  <script src="./js/app.js"></script>
</body>
</html>
