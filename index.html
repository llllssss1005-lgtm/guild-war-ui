  <style>
    :root{
      --bg:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --blue:#3b82f6;
      --sky:#bfe2ff;
      --table:#1d4ed8;
    }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap{
      max-width: 420px;
      margin: 0 auto;
      padding: 18px 16px 28px;
    }

    h1{
      margin: 4px 0 6px;
      font-size: 22px;
      text-align:center;
    }

    .desc{
      margin: 0 0 14px;
      font-size: 13px;
      color: var(--muted);
      text-align:center;
      line-height:1.35;
    }

    .label{
      font-size: 13px;
      font-weight: 700;
      margin: 10px 0 10px;
    }

    .slots{
      display:flex;
      gap:12px;
      justify-content: space-between;
    }

    .slot{
      width: 110px;
      height: 92px;
      border: 2px dashed var(--line);
      border-radius: 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      position: relative;
      background: #fff;
      cursor: pointer;
      user-select:none;
    }

    .slot .plus{
      font-size: 26px;
      color: var(--blue);
      font-weight: 800;
      line-height:1;
    }

    .slot.filled{
      border-style: solid;
      border-color: #c7ddff;
    }

    .slot .thumb{
      width: 44px;
      height: 44px;
      border-radius: 10px;
      overflow:hidden;
      border: 1px solid var(--line);
      background:#f3f4f6;
    }
    .slot .thumb img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
    }

    .slot .name{
      position:absolute;
      left: 10px;
      right: 10px;
      bottom: 8px;
      font-size: 12px;
      font-weight: 800;
      text-align:center;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .slot .remove{
      position:absolute;
      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background:#fff;
      font-weight: 900;
      cursor:pointer;
      display:none;
      line-height: 20px;
    }
    .slot.filled .remove{ display:block; }

    .btnRow{
      display:flex;
      gap:12px;
      margin-top: 14px;
    }

    .btn{
      flex:1;

      font-size: 13px;
    }

      font-size: 12px;

    .resultBox{

      border-radius: 12px;
      padding: 12px;
      min-height: 54px;
      font-size: 13px;
      color: var(--muted);
      background:#fff;
    }

<body>
  <div class="wrap">
    <h1>길드전</h1>
    <p class="desc">방어 유닛 3명을 선택하면 해당 구성에 대한 결과를 조회합니다</p>

    <div class="label">방어 유닛 선택</div>

    <div class="slots">
      <div class="slot" data-slot="0" aria-label="slot 1">
        <div class="plus">+</div>
        <button class="remove" title="제거" aria-label="remove 1">×</button>
      </div>

      <div class="slot" data-slot="1" aria-label="slot 2">
        <div class="plus">+</div>
        <button class="remove" title="제거" aria-label="remove 2">×</button>
      </div>

      <div class="slot" data-slot="2" aria-label="slot 3">
        <div class="plus">+</div>
        <button class="remove" title="제거" aria-label="remove 3">×</button>
      </div>
    </div>

    <div class="btnRow">
      <button class="btn" id="btnReset">초기화</button>
      <button class="btn primary" id="btnSearch">검색</button>
    </div>

    <div class="resultHead">
      <div class="left">결과</div>
      <div class="right" id="statusText">검색 전</div>
    </div>

    <div class="resultBox" id="resultBox">방어 유닛 3명을 선택해 주세요</div>
  </div>

  <!-- modal -->
  <div class="modalBack" id="modalBack" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modalHeader">
        <div class="title">유닛 선택</div>
        <button class="close" id="btnClose" aria-label="닫기">닫기</button>
      </div>
      <div class="search">
        <input id="searchInput" placeholder="이름 검색 (예: 루디)" />
      </div>
      <div class="list" id="unitList"></div>
      <div class="hint">지금은 유닛 목록만 불러옵니다. 다음 단계에서 길드전 결과 테이블을 연결합니다.</div>
    </div>
  </div>

  <!-- ✅ Supabase 라이브러리 (반드시 별도 script로) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ✅ Supabase 설정 -->
  <script>
    const SUPABASE_URL = "https://rtlkthadgfyszawgbevk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Vsr12aXc5r8kCnjBnpvrcQ_4Enqbi3F";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>

  <!-- ✅ 앱 로직 -->
  <script>
    // 선택 슬롯 데이터: { name, image_url }
    const slots = [null, null, null];
    let activeSlotIndex = 0;

    // 유닛 목록(서버에서 로드)
    let UNITS = [];

    const modalBack = document.getElementById("modalBack");
    const unitListEl = document.getElementById("unitList");
    const searchInput = document.getElementById("searchInput");
    const statusText = document.getElementById("statusText");
    const resultBox = document.getElementById("resultBox");

    // --------- UI 렌더 ---------
    function renderSlots(){
      document.querySelectorAll(".slot").forEach((el) => {
        const idx = Number(el.dataset.slot);
        const s = slots[idx];

        el.classList.toggle("filled", !!s);
        el.innerHTML = ""; // reset

        // remove btn
        const rm = document.createElement("button");
        rm.className = "remove";
        rm.title = "제거";
        rm.textContent = "×";
        rm.addEventListener("click", (e) => {
          e.stopPropagation();
          clearSlot(idx);
        });
        el.appendChild(rm);

        if(!s){
          const plus = document.createElement("div");
          plus.className = "plus";
          plus.textContent = "+";
          el.appendChild(plus);
          return;
        }

        const thumb = document.createElement("div");
        thumb.className = "thumb";
        const img = document.createElement("img");
        img.src = s.image_url;
        img.alt = s.name;
        thumb.appendChild(img);

        const nm = document.createElement("div");
        nm.className = "name";
        nm.textContent = s.name;

        el.appendChild(thumb);
        el.appendChild(nm);
      });
    }

    function updateResultHint(){
      const chosen = slots.filter(Boolean);
      if(chosen.length < 3){
        statusText.textContent = "검색 전";
        resultBox.textContent = "방어 유닛 3명을 선택해 주세요";
        return;
      }
      statusText.textContent = "준비됨";
      resultBox.textContent = `선택됨: ${chosen.map(x=>x.name).join(", ")}\n(다음 단계에서 이 구성으로 guild_war 조회)`;
    }

    // --------- 유닛 리스트 렌더 ---------
    function renderUnitList(list){
      unitListEl.innerHTML = "";
      list.forEach((u) => {
        const row = document.createElement("div");
        row.className = "item";

        row.innerHTML = `
  <div class="thumb"><img src="${u.image_url}" alt="${u.name}"></div>
  <div class="name">${u.name}</div>
  <div class="sub">탭해서 선택</div>
`;


        row.addEventListener("click", () => {
          setSlot(activeSlotIndex, u);
          closeModal();
        });

        unitListEl.appendChild(row);
      });

      if(list.length === 0){
        unitListEl.innerHTML = `<div style="padding:14px;color:#6b7280;font-size:13px;">검색 결과가 없습니다</div>`;
      }
    }

    // --------- 슬롯 조작 ---------
    function setSlot(i, unit){
      // 중복 방지
      const already = slots.findIndex(s => s && s.name === unit.name);
      if(already !== -1 && already !== i){
        alert("이미 선택된 유닛입니다.");
        return;
      }
      slots[i] = { id: unit.id, name: unit.name, image_url: unit.image_url };

      renderSlots();
      updateResultHint();
    }

    function clearSlot(i){
      slots[i] = null;
      renderSlots();
      updateResultHint();
    }

    // --------- 모달 ---------
    function openModal(slotIndex){
      activeSlotIndex = slotIndex;
      modalBack.style.display = "flex";
      searchInput.value = "";
      renderUnitList(UNITS);
      setTimeout(()=>searchInput.focus(), 50);
    }

    function closeModal(){
      modalBack.style.display = "none";
    }

    document.getElementById("btnClose").addEventListener("click", closeModal);
    modalBack.addEventListener("click", (e) => {
      if(e.target === modalBack) closeModal();
    });

    // ✅ 슬롯(+) 클릭 이벤트는 openModal 정의 "아래"에서 연결
    document.querySelectorAll(".slot").forEach((el) => {
      el.addEventListener("click", () => {
        const idx = Number(el.dataset.slot);
        openModal(idx);
      });
    });

    // --------- 검색/초기화 버튼 ---------
    document.getElementById("btnReset").addEventListener("click", () => {
      slots[0]=slots[1]=slots[2]=null;
      renderSlots();
      updateResultHint();
    });

    document.getElementById("btnSearch").addEventListener("click", async () => {
  const selected = slots.filter(Boolean);
  if(selected.length < 3){
    alert("방어 유닛 3명을 먼저 선택해 주세요.");
    return;
  }

  // def_key 생성: u005|u035|u036 (정렬 후 |로 연결)
  const defKey = selected
    .map(s => s.id)
    .sort()
    .join("|");
const defNames = selected.map(s => s.name).join(" · ");

  statusText.textContent = "검색중...";
  resultBox.textContent = "잠시만...";

  // guild_war_results 조회
  const { data: rows, error } = await supabaseClient
    .from("guild_war_results")
    .select("result_id, atk_1, atk_2, atk_3, skill_1, skill_2, skill_3, pet, first, note, def_key")
    .eq("def_key", defKey)
    .order("result_id", { ascending: true });

  if(error){
    console.error(error);
    statusText.textContent = "에러";
    resultBox.textContent = "조회 실패(콘솔 확인)";
    return;
  }

  if(!rows || rows.length === 0){
    statusText.textContent = "결과 없음";
    resultBox.textContent = "해당 방어 조합 결과가 없습니다.";
    return;
  }

  // 결과에 필요한 유닛/스킬/펫 id들 모아서 한번에 units 조회
  const ids = new Set();
  rows.forEach(r => {
    [r.atk_1,r.atk_2,r.atk_3,r.skill_1,r.skill_2,r.skill_3,r.pet].forEach(x => {
      if(x) ids.add(x);
    });
  });

  const { data: unitRows, error: unitErr } = await supabaseClient
    .from("units")
    .select("id, name, image_url")
    .in("id", Array.from(ids));

  if(unitErr) console.error(unitErr);

  const unitMap = new Map((unitRows || []).map(u => [u.id, u]));

  // 렌더
  statusText.textContent = `결과 ${rows.length}개`;
  resultBox.innerHTML = rows.map(r => {
    const badgeClass = r.first === "선공" ? "badge red" : "badge blue";

    const pet = unitMap.get(r.pet);
    const atk = [r.atk_1,r.atk_2,r.atk_3].map(id => unitMap.get(id)).filter(Boolean);
    const sk  = [r.skill_1,r.skill_2,r.skill_3].map(id => unitMap.get(id)).filter(Boolean);

      return `
    <div class="card">

      <div class="cardHeader">
  
      </div>

      <div class="mainGrid">
        <div class="panel">
          <div class="panelTitle">공격 유닛</div>
          <div class="unitRow">
            ${atk.map(u => `
              <div class="ico">
                <img src="${u.image_url}" alt="${u.name}">
                <div class="cap">${u.name}</div>
              </div>
            `).join("")}
          </div>
        </div>

        <div class="panel petBox">
          <div class="panelTitle" style="margin-bottom:0;">추천 펫</div>
          ${
            pet
            ? `
              <div class="ico small">
                <img src="${pet.image_url}" alt="${pet.name}">
              </div>
              <div class="petName">${pet.name}</div>
            `
            : `<div style="font-size:12px;color:#6b7280;">없음</div>`
          }
        </div>
      </div>

      <div class="divLine"></div>

      <div class="panelTitle">스킬 순서</div>
      <div class="skillRow">
      

        ${sk.map((u, i) => `
          ${i>0 ? `<div class="arrow">→</div>` : ``}
          <div class="ico small">
            <img src="${u.image_url}" alt="${u.name}">
            <div class="cap">${u.name}</div>
          </div>
        `).join("")}
      </div>
<div class="petBottomRow">
  <div class="panel petBox">
    <div class="panelTitle">추천 펫</div>
    ${
      pet
        ? `
          <div class="ico small">
            <img src="${pet.image_url}" alt="${pet.name}">
            <div class="cap">${pet.name}</div>
          </div>
        `
        : `<div class="cap" style="color:#94a3b8;">없음</div>`
    }
  </div>

  <div class="panel firstBox">
    <div class="panelTitle">선 / 후</div>
    <span class="${badgeClass}">${r.first ?? ""}</span>
  </div>
</div>

      ${r.note ? `<div class="noteBox">${r.note}</div>` : ``}
    </div>
  `;

  }).join("");
});

    // 검색 입력 필터
    searchInput.addEventListener("input", () => {
      const q = searchInput.value.trim().toLowerCase();
      if(!q){
        renderUnitList(UNITS);
        return;
      }
      const filtered = UNITS.filter(u => (u.name || "").toLowerCase().includes(q));
      renderUnitList(filtered);
    });

    // --------- Supabase에서 units 불러오기 ---------
    async function loadUnits(){
      statusText.textContent = "유닛 로딩중...";
      const { data, error } = await supabaseClient
  .from("units")
.select("id, name, image_url")
.eq("kind", "unit")
.order("name", { ascending: true });



if(error){
  console.error(error);
  statusText.textContent = "유닛 로드 실패";
  resultBox.textContent = "유닛을 불러오지 못했습니다. (RLS/정책 또는 컬럼명 확인 필요)";
  return;
}

UNITS = (data || []).map(u => ({
  id: u.id,
  name: u.name,
  image_url: u.image_url
}));


      statusText.textContent = `유닛 ${UNITS.length}개 로드됨`;
      updateResultHint();
    }

    // init
    renderSlots();
    updateResultHint();
    loadUnits();
  </script>
</body>
