<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>길드전</title>

  <style>
    :root{
      --bg:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --blue:#3b82f6;
      --sky:#bfe2ff;
      --card:#ffffff;
    }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap{
      max-width: 420px;
      margin: 0 auto;
      padding: 18px 16px 28px;
    }

    h1{
      margin: 4px 0 6px;
      font-size: 22px;
      text-align:center;
    }

    .desc{
      margin: 0 0 14px;
      font-size: 13px;
      color: var(--muted);
      text-align:center;
      line-height:1.35;
    }

    .label{
      font-size: 13px;
      font-weight: 800;
      margin: 10px 0 10px;
    }

    /* ===== 상단 3칸 슬롯 ===== */
    .slots{
      display:flex;
      gap:12px;
      justify-content: space-between;
    }

    .slot{
      width: 110px;
      height: 92px;
      border: 2px dashed var(--line);
      border-radius: 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      position: relative;
      background: #fff;
      cursor: pointer;
      user-select:none;
    }

    .slot .plus{
      font-size: 26px;
      color: var(--blue);
      font-weight: 900;
      line-height:1;
    }

    .slot.filled{
      border-style: solid;
      border-color: #c7ddff;
    }

    .slot .thumb{
      width: 44px;
      height: 44px;
      border-radius: 10px;
      overflow:hidden;
      border: 1px solid var(--line);
      background:#f3f4f6;
    }
    .slot .thumb img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
    }

    .slot .name{
      position:absolute;
      left: 10px;
      right: 10px;
      bottom: 8px;
      font-size: 12px;
      font-weight: 800;
      text-align:center;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .slot .remove{
      position:absolute;
      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background:#fff;
      font-weight: 900;
      cursor:pointer;
      display:none;
      line-height: 20px;
    }
    .slot.filled .remove{ display:block; }

    .btnRow{
      display:flex;
      gap:12px;
      margin-top: 14px;
    }

    .btn{
      flex:1;
      height: 44px;
      border-radius: 10px;
      border: 1px solid #dbeafe;
      background:#fff;
      font-weight: 800;
      cursor:pointer;
    }
    .btn.primary{
      background: var(--sky);
      border-color: #93c5fd;
    }

    .resultHead{
      margin-top: 18px;
      display:flex;
      justify-content: space-between;
      align-items:center;
      font-weight: 900;
      font-size: 13px;
    }
    .resultHead .right{
      color: var(--muted);
      font-weight: 700;
      font-size: 12px;
    }

    .resultBox{
      margin-top: 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      min-height: 54px;
      font-size: 13px;
      color: var(--muted);
      background:#fff;
    }

    /* ===== 옵션A: 페이저 ===== */
    .resultToolbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:10px;
    }

    .pager{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .pagerBtn{
      height:32px;
      min-width:38px;
      border-radius:10px;
      border:1px solid #dbeafe;
      background:#fff;
      font-weight:900;
      cursor:pointer;
    }
    .pagerBtn:disabled{
      opacity:.45;
      cursor:not-allowed;
    }

    .pageInfo{
      font-size:12px;
      font-weight:800;
      color:#374151;
      min-width:70px;
      text-align:center;
    }

    /* =========================================================
       ✅ 결과 카드 UI (빨간 5박스 구성)
       - 오른쪽 폭 줄임
       - 오른쪽 제목 중앙 정렬
       - 이미지/폰트 소폭 축소
       - 화살표 제거
       ========================================================= */
    .card{
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
      background: var(--card);
      color: var(--text);
    }

    .gridLayout{
      display:grid;
      grid-template-columns: 1fr 104px; /* ✅ 오른쪽 폭 축소(120→104) */
      gap:12px;
      align-items:stretch;
    }

    .panel{
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px;
      background:#fff;
    }

    .panelTitle{
      font-size:12px;
      font-weight:900;
      color:#111827;
      margin-bottom:8px;
    }

    /* 공격/스킬: 3칸 고정 */
    .grid3{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:8px; /* ✅ 살짝 촘촘하게 */
    }

    .cell{
      text-align:center;
      min-width:0;
    }

    /* ✅ 이미지 크기 소폭 축소 (56→48) */
    .cell img{
      width:48px;
      height:48px;
      border-radius:14px;
      object-fit:cover;
      border:1px solid rgba(0,0,0,.06);
      background:#f3f4f6;
      display:block;
      margin:0 auto;
    }

    /* ✅ 캡션 폰트 소폭 축소 */
    .cap{
      margin-top:4px;
      font-size:11px;
      font-weight:800;
      color:#374151;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* 없을 때도 자리 유지 */
    .emptyBox{
      width:48px;
      height:48px;
      border-radius:14px;
      background:#f3f4f6;
      border:1px solid rgba(0,0,0,.06);
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#9ca3af;
      font-weight:900;
      font-size:11px;
    }

    /* 오른쪽 작은 박스: 중앙 정렬 */
    .centerCol{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      text-align:center;
    }

    /* ✅ 오른쪽 제목도 박스 기준 중앙 정렬 */
    .centerCol .panelTitle{
      width:100%;
      text-align:center;
      margin-bottom:10px;
    }

    .petName{
      margin-top:6px;
      font-size:11px; /* ✅ 소폭 축소 */
      font-weight:900;
      color:#111827;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      width:100%;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      height:26px;
      padding:0 10px;
      border-radius:999px;
      font-weight:900;
      font-size:12px;
      color:#fff;
      margin-top:6px;
    }
    .badge.red{ background:#ef4444; }
    .badge.blue{ background:#3b82f6; }
    .badge.gray{ background:#9ca3af; }

    /* 노트(아래 full) */
    .notePanel{
      grid-column: 1 / -1;
    }

    .noteHead{
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:6px;
      color:#1e5aa8;
      font-weight:900;
      font-size:12px;
    }

    .noteText{
      white-space: pre-wrap;
      font-size:12px;
      line-height:1.4;
      max-height: 4.2em;   /* 약 3줄 */
      overflow-y:auto;
      padding-right:6px;
      color:#111827;
    }

    /* ===== modal ===== */
    .modalBack{
      position: fixed;
      inset: 0;
      background: rgba(17,24,39,.45);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 16px;
      z-index: 9999;
    }
    .modal{
      position:relative;
      z-index:10000;
      width: 100%;
      max-width: 420px;
      background:#fff;
      border-radius: 14px;
      overflow:hidden;
      border: 1px solid var(--line);
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
    }
    .modalHeader{
      display:flex;
      align-items:center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background:#fff;
    }
    .modalHeader .title{
      font-weight: 900;
      font-size: 14px;
    }
    .modalHeader .close{
      border:1px solid var(--line);
      background:#fff;
      border-radius: 10px;
      padding: 6px 10px;
      cursor:pointer;
      font-weight:900;
    }
    .search{
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background:#fff;
    }
    .search input{
      width:100%;
      height: 42px;
      border-radius: 10px;
      border: 1px solid #dbeafe;
      padding: 0 12px;
      font-size: 14px;
      outline:none;
    }

    #unitList{
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding: 14px 14px 16px;
      max-height: 420px;
      overflow:auto;
      background:#fff;
    }

    #unitList .item{
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 10px 8px;
      border-radius: 14px;
      border: 1px solid #e8eef7;
      background: #fff;
      cursor: pointer;
    }

    #unitList .item:hover{
      border-color:#93c5fd;
      background:#f8fbff;
    }

    #unitList .thumb{
      width: 64px;
      height: 64px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      background:#f3f4f6;
    }
    #unitList .thumb img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
    }

    #unitList .name{
      font-weight: 800;
      font-size: 12px;
      line-height: 1.15;
      letter-spacing: -0.2px;
      text-align: center;
      word-break: keep-all;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      color:#111827;
    }

    .hint{
      padding: 10px 12px 14px;
      color: var(--muted);
      font-size: 12px;
      border-top: 1px dashed var(--line);
      background:#fff;
    }

    /* ✅ 모바일에서 추가로 살짝 더 타이트하게(선택적) */
    @media (max-width: 360px){
      .gridLayout{ grid-template-columns: 1fr 96px; }
      .cell img, .emptyBox{ width:46px; height:46px; }
      .cap{ font-size:10.5px; }
      .petName{ font-size:10.5px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>길드전</h1>
    <p class="desc">방어 유닛 3명을 선택하면 해당 구성에 대한 결과를 조회합니다</p>

    <div class="label">방어 유닛 선택</div>

    <div class="slots">
      <div class="slot" data-slot="0" aria-label="slot 1">
        <div class="plus">+</div>
        <button class="remove" title="제거" aria-label="remove 1">×</button>
      </div>

      <div class="slot" data-slot="1" aria-label="slot 2">
        <div class="plus">+</div>
        <button class="remove" title="제거" aria-label="remove 2">×</button>
      </div>

      <div class="slot" data-slot="2" aria-label="slot 3">
        <div class="plus">+</div>
        <button class="remove" title="제거" aria-label="remove 3">×</button>
      </div>
    </div>

    <div class="btnRow">
      <button class="btn" id="btnReset">초기화</button>
      <button class="btn primary" id="btnSearch">검색</button>
    </div>

    <div class="resultHead">
      <div class="left">결과</div>
      <div class="right" id="statusText">검색 전</div>
    </div>

    <div class="resultBox" id="resultBox">방어 유닛 3명을 선택해 주세요</div>
  </div>

  <!-- modal -->
  <div class="modalBack" id="modalBack" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modalHeader">
        <div class="title">유닛 선택</div>
        <button class="close" id="btnClose" aria-label="닫기">닫기</button>
      </div>
      <div class="search">
        <input id="searchInput" placeholder="이름 검색 (예: 루디)" />
      </div>
      <div id="unitList"></div>
      <div class="hint">유닛을 선택하고 방어 3명을 채운 뒤 검색하세요.</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://rtlkthadgfyszawgbevk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Vsr12aXc5r8kCnjBnpvrcQ_4Enqbi3F";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const slots = [null, null, null];
    let activeSlotIndex = 0;

    let UNITS = [];
    let RESULTS = [];
    let currentIndex = 0;

    const modalBack = document.getElementById("modalBack");
    const unitListEl = document.getElementById("unitList");
    const searchInput = document.getElementById("searchInput");
    const statusText = document.getElementById("statusText");
    const resultBox = document.getElementById("resultBox");

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    /* ===== 슬롯 렌더 ===== */
    function renderSlots(){
      document.querySelectorAll(".slot").forEach((el) => {
        const idx = Number(el.dataset.slot);
        const s = slots[idx];

        el.classList.toggle("filled", !!s);
        el.innerHTML = "";

        const rm = document.createElement("button");
        rm.className = "remove";
        rm.title = "제거";
        rm.textContent = "×";
        rm.addEventListener("click", (e) => {
          e.stopPropagation();
          clearSlot(idx);
        });
        el.appendChild(rm);

        if(!s){
          const plus = document.createElement("div");
          plus.className = "plus";
          plus.textContent = "+";
          el.appendChild(plus);
          return;
        }

        const thumb = document.createElement("div");
        thumb.className = "thumb";
        const img = document.createElement("img");
        img.src = s.image_url;
        img.alt = s.name;
        thumb.appendChild(img);

        const nm = document.createElement("div");
        nm.className = "name";
        nm.textContent = s.name;

        el.appendChild(thumb);
        el.appendChild(nm);
      });
    }

    function updateResultHint(){
      const chosen = slots.filter(Boolean);
      if(chosen.length < 3){
        statusText.textContent = "검색 전";
        resultBox.textContent = "방어 유닛 3명을 선택해 주세요";
        RESULTS = [];
        currentIndex = 0;
        return;
      }
      statusText.textContent = "준비됨";
      resultBox.textContent = `선택됨: ${chosen.map(x=>x.name).join(", ")}`;
    }

    /* ===== 유닛 리스트 ===== */
    function renderUnitList(list){
      unitListEl.innerHTML = "";
      list.forEach((u) => {
        const row = document.createElement("div");
        row.className = "item";
        row.innerHTML = `
          <div class="thumb"><img src="${u.image_url}" alt="${escapeHtml(u.name)}"></div>
          <div class="name">${escapeHtml(u.name)}</div>
        `;
        row.addEventListener("click", () => {
          setSlot(activeSlotIndex, u);
          closeModal();
        });
        unitListEl.appendChild(row);
      });

      if(list.length === 0){
        unitListEl.innerHTML = `<div style="padding:14px;color:#6b7280;font-size:13px;">검색 결과가 없습니다</div>`;
      }
    }

    function setSlot(i, unit){
      const already = slots.findIndex(s => s && s.name === unit.name);
      if(already !== -1 && already !== i){
        alert("이미 선택된 유닛입니다.");
        return;
      }
      slots[i] = { id: unit.id, name: unit.name, image_url: unit.image_url };
      renderSlots();
      updateResultHint();
    }

    function clearSlot(i){
      slots[i] = null;
      renderSlots();
      updateResultHint();
    }

    /* ===== 모달 ===== */
    function openModal(slotIndex){
      activeSlotIndex = slotIndex;
      modalBack.style.display = "flex";
      searchInput.value = "";
      renderUnitList(UNITS);
      setTimeout(() => searchInput.focus({ preventScroll:true }), 50);
    }
    function closeModal(){
      modalBack.style.display = "none";
    }

    document.getElementById("btnClose").addEventListener("click", closeModal);
    modalBack.addEventListener("click", (e) => {
      if(e.target === modalBack) closeModal();
    });
    document.querySelectorAll(".slot").forEach((el) => {
      el.addEventListener("click", () => openModal(Number(el.dataset.slot)));
    });

    /* ===== 결과 렌더 도우미 ===== */
    function cellHtml(unit){
      if(!unit){
        return `
          <div class="cell">
            <div class="emptyBox">없음</div>
            <div class="cap">없음</div>
          </div>
        `;
      }
      return `
        <div class="cell">
          <img src="${unit.image_url}" alt="${escapeHtml(unit.name)}">
          <div class="cap">${escapeHtml(unit.name)}</div>
        </div>
      `;
    }

    function renderSingleResult(){
      const total = RESULTS.length;
      const hasAny = total > 0;

      const idx = Math.min(Math.max(currentIndex, 0), Math.max(total - 1, 0));
      currentIndex = idx;

      const r = hasAny ? RESULTS[idx] : null;

      const atkArr = r ? r.atk : [null, null, null];
      const skArr  = r ? r.skill : [null, null, null];
      const pet    = r ? r.pet : null;

      const firstText = r?.first ?? "없음";
      const badgeClass =
        firstText === "선공" ? "badge red" :
        firstText === "후공" ? "badge blue" :
        "badge gray";

      const noteText = (r?.note ?? "").trim();
      const pageLabel = hasAny ? `${idx+1} / ${total}` : `0 / 0`;

      resultBox.innerHTML = `
        <div class="resultToolbar">
          <div style="font-weight:900;color:#111827;">검색 결과</div>
          <div class="pager">
            <button class="pagerBtn" id="btnPrev" ${(!hasAny || idx===0) ? "disabled":""}>◀</button>
            <div class="pageInfo">${pageLabel}</div>
            <button class="pagerBtn" id="btnNext" ${(!hasAny || idx===total-1) ? "disabled":""}>▶</button>
          </div>
        </div>

        <div class="card">
          <div class="gridLayout">
            <!-- 1) 공격 유닛 -->
            <div class="panel">
              <div class="panelTitle">공격 유닛</div>
              <div class="grid3">
                ${cellHtml(atkArr[0])}
                ${cellHtml(atkArr[1])}
                ${cellHtml(atkArr[2])}
              </div>
            </div>

            <!-- 2) 추천 펫(중앙정렬) -->
            <div class="panel centerCol">
              <div class="panelTitle">추천 펫</div>
              ${pet ? `
                <div class="cell">
                  <img src="${pet.image_url}" alt="${escapeHtml(pet.name)}">
                  <div class="petName">${escapeHtml(pet.name)}</div>
                </div>
              ` : `
                <div class="cell">
                  <div class="emptyBox">없음</div>
                  <div class="petName">없음</div>
                </div>
              `}
            </div>

            <!-- 3) 스킬 순서 (화살표 제거, 3칸 고정) -->
            <div class="panel">
              <div class="panelTitle">스킬 순서</div>
              <div class="grid3">
                ${cellHtml(skArr[0])}
                ${cellHtml(skArr[1])}
                ${cellHtml(skArr[2])}
              </div>
            </div>

            <!-- 4) 선/후(중앙정렬) -->
            <div class="panel centerCol">
              <div class="panelTitle">선 / 후</div>
              <span class="${badgeClass}">${escapeHtml(firstText)}</span>
            </div>

            <!-- 5) 노트(full) -->
            <div class="panel notePanel">
              <div class="noteHead">📌 노트</div>
              <div class="noteText">${escapeHtml(noteText || "없음")}</div>
            </div>
          </div>
        </div>
      `;

      const prevBtn = document.getElementById("btnPrev");
      const nextBtn = document.getElementById("btnNext");

      if(prevBtn) prevBtn.addEventListener("click", () => {
        if(currentIndex > 0){
          currentIndex--;
          renderSingleResult();
        }
      });
      if(nextBtn) nextBtn.addEventListener("click", () => {
        if(currentIndex < total - 1){
          currentIndex++;
          renderSingleResult();
        }
      });
    }

    /* ===== 버튼 ===== */
    document.getElementById("btnReset").addEventListener("click", () => {
      slots[0]=slots[1]=slots[2]=null;
      RESULTS = [];
      currentIndex = 0;
      renderSlots();
      updateResultHint();
    });

    document.getElementById("btnSearch").addEventListener("click", async () => {
      const selected = slots.filter(Boolean);
      if(selected.length < 3){
        alert("방어 유닛 3명을 먼저 선택해 주세요.");
        return;
      }

      const defKey = selected
        .map(s => s.id)
        .sort()
        .join("|");

      statusText.textContent = "검색중...";
      resultBox.textContent = "잠시만...";

      const { data: rows, error } = await supabaseClient
        .from("guild_war_results")
        .select("result_id, atk_1, atk_2, atk_3, skill_1, skill_2, skill_3, pet, first, note, def_key")
        .eq("def_key", defKey)
        .order("result_id", { ascending: true });

      if(error){
        console.error(error);
        statusText.textContent = "에러";
        resultBox.textContent = "조회 실패(콘솔 확인)";
        return;
      }

      if(!rows || rows.length === 0){
        statusText.textContent = "결과 없음";
        RESULTS = [];
        currentIndex = 0;
        renderSingleResult();
        return;
      }

      const ids = new Set();
      rows.forEach(r => {
        [r.atk_1,r.atk_2,r.atk_3,r.skill_1,r.skill_2,r.skill_3,r.pet].forEach(x => {
          if(x) ids.add(x);
        });
      });

      const { data: unitRows, error: unitErr } = await supabaseClient
        .from("units")
        .select("id, name, image_url")
        .in("id", Array.from(ids));

      if(unitErr) console.error(unitErr);

      const unitMap = new Map((unitRows || []).map(u => [u.id, u]));

      RESULTS = rows.map(r => {
        const atk = [r.atk_1, r.atk_2, r.atk_3].map(id => unitMap.get(id) || null);
        const skill = [r.skill_1, r.skill_2, r.skill_3].map(id => unitMap.get(id) || null);
        const pet = unitMap.get(r.pet) || null;
        return {
          result_id: r.result_id,
          first: r.first ?? "없음",
          note: r.note ?? "",
          atk,
          skill,
          pet
        };
      });

      currentIndex = 0;
      statusText.textContent = `결과 ${RESULTS.length}개`;
      renderSingleResult();
    });

    /* ===== 모달 검색 필터 ===== */
    searchInput.addEventListener("input", () => {
      const q = searchInput.value.trim().toLowerCase();
      if(!q){
        renderUnitList(UNITS);
        return;
      }
      const filtered = UNITS.filter(u => (u.name || "").toLowerCase().includes(q));
      renderUnitList(filtered);
    });

    /* ===== units 로드 ===== */
    async function loadUnits(){
      statusText.textContent = "유닛 로딩중...";
      const { data, error } = await supabaseClient
        .from("units")
        .select("id, name, image_url")
        .eq("kind", "unit")
        .order("name", { ascending: true });

      if(error){
        console.error(error);
        statusText.textContent = "유닛 로드 실패";
        resultBox.textContent = "유닛을 불러오지 못했습니다. (RLS/정책 또는 컬럼 확인)";
        return;
      }

      UNITS = (data || []).map(u => ({
        id: u.id,
        name: u.name,
        image_url: u.image_url
      }));

      statusText.textContent = `유닛 ${UNITS.length}개 로드됨`;
      updateResultHint();
    }

    /* init */
    renderSlots();
    updateResultHint();
    loadUnits();
  </script>
</body>
</html>
