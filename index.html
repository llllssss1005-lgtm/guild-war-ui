<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>길드전</title>

  <style>
    :root{
      --bg:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --blue:#3b82f6;
      --sky:#bfe2ff;
      --card:#ffffff;
      --kakao:#FEE500;
      --kakaoText:#191600;
    }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap{
      max-width: 420px;
      margin: 0 auto;
      padding: 18px 16px 28px;
    }

    h1{
      margin: 4px 0 6px;
      font-size: 22px;
      text-align:center;
    }

    .desc{
      margin: 0 0 14px;
      font-size: 13px;
      color: var(--muted);
      text-align:center;
      line-height:1.35;
    }

    .label{
      font-size: 13px;
      font-weight: 800;
      margin: 10px 0 10px;
    }

    /* ===== 게이트(로그인) ===== */
    .gateWrap{
      max-width: 420px;
      margin: 0 auto;
      padding: 18px 16px 10px;
    }
    .gateCard{
      border:1px solid var(--line);
      border-radius:14px;
      background:#fff;
      padding:14px;
    }
    .gateTitle{
      font-weight: 900;
      font-size: 16px;
      margin: 0 0 6px;
      text-align:center;
    }
    .gateDesc{
      margin: 0 0 12px;
      font-size: 12px;
      color: var(--muted);
      text-align:center;
      line-height:1.4;
    }
    .gateBtn{
      width:100%;
      height: 44px;
      border-radius: 12px;
      border: 0;
      cursor:pointer;
      font-weight: 900;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }
    .gateBtn.kakao{
      background: var(--kakao);
      color: var(--kakaoText);
    }
    .kakaoBadge{
      width:22px;height:22px;
      border-radius:6px;
      background: rgba(0,0,0,.08);
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }
    .gateRow{
      display:flex;
      gap:10px;
      margin-top: 12px;
    }
    .gateRow > div{ flex:1; }
    .gateLabel{
      font-size: 12px;
      color: var(--muted);
      font-weight: 800;
      margin: 10px 0 6px;
    }
    .gateInput{
      width:100%;
      height: 42px;
      border-radius: 12px;
      border: 1px solid #dbeafe;
      padding: 0 12px;
      font-size: 14px;
      outline:none;
    }
    .gateInput:focus{
      border-color:#93c5fd;
      box-shadow: 0 0 0 4px rgba(59,130,246,.12);
    }
    .gateBtn.primary{
      margin-top: 12px;
      background: var(--sky);
      border: 1px solid #93c5fd;
      color: #0f172a;
    }
    .gateMsg{
      margin-top: 10px;
      font-size: 12px;
      color: #991b1b;
      font-weight: 900;
      display:none;
      background:#fee2e2;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #fecaca;
    }
    .gateHelp{
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      text-align:center;
    }
    .gateHelp a{
      color:#1d4ed8;
      font-weight: 900;
      text-decoration:none;
    }
    .gateHelp a:hover{ text-decoration:underline; }

    /* ===== 상단 3칸 슬롯 ===== */
    .slots{
      display:flex;
      gap:12px;
      justify-content: space-between;
    }

    .slot{
      width: 110px;
      height: 92px;
      border: 2px dashed var(--line);
      border-radius: 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      position: relative;
      background: #fff;
      cursor: pointer;
      user-select:none;
    }

    .slot .plus{
      font-size: 26px;
      color: var(--blue);
      font-weight: 900;
      line-height:1;
    }

    .slot.filled{
      border-style: solid;
      border-color: #c7ddff;
    }

    .slot .thumb{
      width: 44px;
      height: 44px;
      border-radius: 10px;
      overflow:hidden;
      border: 1px solid var(--line);
      background:#f3f4f6;
    }
    .slot .thumb img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
    }

    .slot .name{
      position:absolute;
      left: 10px;
      right: 10px;
      bottom: 8px;
      font-size: 12px;
      font-weight: 800;
      text-align:center;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .slot .remove{
      position:absolute;
      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background:#fff;
      font-weight: 900;
      cursor:pointer;
      display:none;
      line-height: 20px;
    }
    .slot.filled .remove{ display:block; }

    .btnRow{
      display:flex;
      gap:12px;
      margin-top: 14px;
    }

    .btn{
      flex:1;
      height: 44px;
      border-radius: 10px;
      border: 1px solid #dbeafe;
      background:#fff;
      font-weight: 800;
      cursor:pointer;
    }
    .btn.primary{
      background: var(--sky);
      border-color: #93c5fd;
    }

    .resultHead{
      margin-top: 18px;
      display:flex;
      justify-content: space-between;
      align-items:center;
      font-weight: 900;
      font-size: 13px;
    }
    .resultHead .right{
      color: var(--muted);
      font-weight: 700;
      font-size: 12px;
    }

    .resultBox{
      margin-top: 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      min-height: 54px;
      font-size: 13px;
      color: var(--muted);
      background:#fff;
    }

    /* ===== 옵션A: 페이저 ===== */
    .resultToolbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:10px;
    }

    .pager{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .pagerBtn{
      height:32px;
      min-width:38px;
      border-radius:10px;
      border:1px solid #dbeafe;
      background:#fff;
      font-weight:900;
      cursor:pointer;
    }
    .pagerBtn:disabled{
      opacity:.45;
      cursor:not-allowed;
    }

    .pageInfo{
      font-size:12px;
      font-weight:800;
      color:#374151;
      min-width:70px;
      text-align:center;
    }

    /* ===== 결과 카드 UI ===== */
    .card{
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
      background: var(--card);
      color: var(--text);
    }

    .gridLayout{
      display:grid;
      grid-template-columns: 1fr 104px;
      gap:12px;
      align-items:stretch;
    }

    .panel{
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px;
      background:#fff;
    }

    .panelTitle{
      font-size:12px;
      font-weight:900;
      color:#111827;
      margin-bottom:8px;
    }

    .grid3{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:8px;
    }

    .cell{
      text-align:center;
      min-width:0;
    }

    .cell img{
      width:48px;
      height:48px;
      border-radius:14px;
      object-fit:cover;
      border:1px solid rgba(0,0,0,.06);
      background:#f3f4f6;
      display:block;
      margin:0 auto;
    }

    .cap{
      margin-top:4px;
      font-size:11px;
      font-weight:800;
      color:#374151;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .emptyBox{
      width:48px;
      height:48px;
      border-radius:14px;
      background:#f3f4f6;
      border:1px solid rgba(0,0,0,.06);
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#9ca3af;
      font-weight:900;
      font-size:11px;
    }

    .centerCol{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      text-align:center;
    }

    .centerCol .panelTitle{
      width:100%;
      text-align:center;
      margin-bottom:10px;
    }

    .petName{
      margin-top:6px;
      font-size:11px;
      font-weight:900;
      color:#111827;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      width:100%;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      height:26px;
      padding:0 10px;
      border-radius:999px;
      font-weight:900;
      font-size:12px;
      color:#fff;
      margin-top:6px;
    }
    .badge.red{ background:#ef4444; }
    .badge.blue{ background:#3b82f6; }
    .badge.gray{ background:#9ca3af; }

    .notePanel{
      grid-column: 1 / -1;
    }

    .noteHead{
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:6px;
      color:#1e5aa8;
      font-weight:900;
      font-size:12px;
    }

    .noteText{
      white-space: pre-wrap;
      font-size:12px;
      line-height:1.4;
      max-height: 4.2em;
      overflow-y:auto;
      padding-right:6px;
      color:#111827;
    }

    /* ===== modal ===== */
    .modalBack{
      position: fixed;
      inset: 0;
      background: rgba(17,24,39,.45);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 16px;
      z-index: 9999;
    }
    .modal{
      position:relative;
      z-index:10000;
      width: 100%;
      max-width: 420px;
      background:#fff;
      border-radius: 14px;
      overflow:hidden;
      border: 1px solid var(--line);
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
    }
    .modalHeader{
      display:flex;
      align-items:center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background:#fff;
    }
    .modalHeader .title{
      font-weight: 900;
      font-size: 14px;
    }
    .modalHeader .close{
      border:1px solid var(--line);
      background:#fff;
      border-radius: 10px;
      padding: 6px 10px;
      cursor:pointer;
      font-weight:900;
    }
    .search{
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background:#fff;
    }
    .search input{
      width:100%;
      height: 42px;
      border-radius: 10px;
      border: 1px solid #dbeafe;
      padding: 0 12px;
      font-size: 14px;
      outline:none;
    }

    #unitList{
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding: 14px 14px 16px;
      max-height: 420px;
      overflow:auto;
      background:#fff;
    }

    #unitList .item{
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 10px 8px;
      border-radius: 14px;
      border: 1px solid #e8eef7;
      background: #fff;
      cursor: pointer;
    }

    #unitList .item:hover{
      border-color:#93c5fd;
      background:#f8fbff;
    }

    #unitList .thumb{
      width: 64px;
      height: 64px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      background:#f3f4f6;
    }
    #unitList .thumb img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
    }

    #unitList .name{
      font-weight: 800;
      font-size: 12px;
      line-height: 1.15;
      letter-spacing: -0.2px;
      text-align: center;
      word-break: keep-all;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      color:#111827;
    }

    .hint{
      padding: 10px 12px 14px;
      color: var(--muted);
      font-size: 12px;
      border-top: 1px dashed var(--line);
      background:#fff;
    }

    @media (max-width: 360px){
      .gridLayout{ grid-template-columns: 1fr 96px; }
      .cell img, .emptyBox{ width:46px; height:46px; }
      .cap{ font-size:10.5px; }
      .petName{ font-size:10.5px; }
    }
  </style>
</head>

<body>
  <!-- ✅ 1) 게이트 화면 -->
  <div id="gate" class="gateWrap">
    <div class="gateCard">
      <div class="gateTitle">길드전 열람 코드 입력</div>
      <div class="gateDesc">
        먼저 카카오톡으로 연락해 <b>아이디 + 코드번호</b>를 받으세요.<br/>
        받은 뒤 아래에 입력하면 열람 가능합니다.
      </div>

      <button class="gateBtn kakao" id="btnKakao" type="button">
        <span class="kakaoBadge" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M12 3C6.477 3 2 6.582 2 11c0 2.74 1.77 5.15 4.5 6.62L5.8 21l4.03-2.2c.7.1 1.43.15 2.17.15 5.523 0 10-3.582 10-8s-4.477-8-10-8Z" fill="#191600" opacity=".92"/>
            <path d="M8.3 10.2h7.4M8.3 12.2h5.2" stroke="#FEE500" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </span>
        코드 받기 (카카오톡)
      </button>

      <div class="gateRow">
        <div>
          <div class="gateLabel">아이디 (1~40)</div>
          <input id="gateId" class="gateInput" inputmode="numeric" placeholder="예: 7" />
        </div>
        <div>
          <div class="gateLabel">코드번호 (1001~1040)</div>
          <input id="gateCode" class="gateInput" inputmode="numeric" placeholder="예: 1007" />
        </div>
      </div>

      <button class="gateBtn primary" id="btnGateEnter" type="button">확인</button>

      <div id="gateMsg" class="gateMsg"></div>

      <div class="gateHelp">
        문제가 있으면 <a href="https://open.kakao.com/o/smXJOCfi" target="_blank" rel="noopener">관리자에게 카카오톡으로 연락</a>해주세요.
      </div>
    </div>
  </div>

  <!-- ✅ 2) 기존 길드전 UI (그대로) -->
  <div id="app" class="wrap" style="display:none;">
    <h1>길드전</h1>
    <p class="desc">방어 유닛 3명을 선택하면 해당 구성에 대한 결과를 조회합니다</p>

    <div class="label">방어 유닛 선택</div>

    <div class="slots">
      <div class="slot" data-slot="0" aria-label="slot 1">
        <div class="plus">+</div>
        <button class="remove" title="제거" aria-label="remove 1">×</button>
      </div>

      <div class="slot" data-slot="1" aria-label="slot 2">
        <div class="plus">+</div>
        <button class="remove" title="제거" aria-label="remove 2">×</button>
      </div>

      <div class="slot" data-slot="2" aria-label="slot 3">
        <div class="plus">+</div>
        <button class="remove" title="제거" aria-label="remove 3">×</button>
      </div>
    </div>

    <div class="btnRow">
      <button class="btn" id="btnReset">초기화</button>
      <button class="btn primary" id="btnSearch">검색</button>
    </div>

    <div class="resultHead">
      <div class="left">결과</div>
      <div class="right" id="statusText">검색 전</div>
    </div>

    <div class="resultBox" id="resultBox">방어 유닛 3명을 선택해 주세요</div>
  </div>

  <!-- modal -->
  <div class="modalBack" id="modalBack" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modalHeader">
        <div class="title">유닛 선택</div>
        <button class="close" id="btnClose" aria-label="닫기">닫기</button>
      </div>
      <div class="search">
        <input id="searchInput" placeholder="이름 검색 (예: 루디)" />
      </div>
      <div id="unitList"></div>
      <div class="hint">유닛을 선택하고 방어 3명을 채운 뒤 검색하세요.</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // =========================================================
    // ✅ 1) Supabase 연결 (기존 유지)
    // =========================================================
    const SUPABASE_URL = "https://rtlkthadgfyszawgbevk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Vsr12aXc5r8kCnjBnpvrcQ_4Enqbi3F";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // =========================================================
    // ✅ 2) 게이트(아이디+코드번호) 로직 (추가)
    // =========================================================
    const KAKAO_LINK = "https://open.kakao.com/o/smXJOCfi";
    const SESSION_KEY = "guild_gate_ok_v1";

    const gateEl = document.getElementById("gate");
    const appEl = document.getElementById("app");
    const gateMsgEl = document.getElementById("gateMsg");

    const btnKakao = document.getElementById("btnKakao");
    const btnGateEnter = document.getElementById("btnGateEnter");
    const gateIdInput = document.getElementById("gateId");
    const gateCodeInput = document.getElementById("gateCode");

    function showGateMsg(msg){
      gateMsgEl.style.display = "block";
      gateMsgEl.textContent = msg;
    }
    function clearGateMsg(){
      gateMsgEl.style.display = "none";
      gateMsgEl.textContent = "";
    }

    function passGate(){
      localStorage.setItem(SESSION_KEY, "1");
      gateEl.style.display = "none";
      appEl.style.display = "block";
      // 길드전 데이터 로드 시작
      initGuildWar();
    }

    function failGate(msg){
      localStorage.removeItem(SESSION_KEY);
      gateEl.style.display = "block";
      appEl.style.display = "none";
      showGateMsg(msg);
    }

    // 규칙: id=1..40 / code=1000+id (즉 1001~1040)
    function validateGate(idStr, codeStr){
      const id = Number(String(idStr||"").trim());
      const code = Number(String(codeStr||"").trim());
      if(!Number.isInteger(id) || id < 1 || id > 40) return { ok:false, msg:"아이디는 1~40 사이 숫자만 가능해요." };
      if(!Number.isInteger(code) || code < 1001 || code > 1040) return { ok:false, msg:"코드번호는 1001~1040 사이 숫자만 가능해요." };
      if(code !== 1000 + id) return { ok:false, msg:"아이디/코드번호가 맞지 않아요. 관리자에게 카카오톡으로 문의해주세요." };
      return { ok:true, id, code };
    }

    btnKakao.addEventListener("click", () => {
      window.open(KAKAO_LINK, "_blank", "noopener");
    });

    btnGateEnter.addEventListener("click", () => {
      clearGateMsg();
      const res = validateGate(gateIdInput.value, gateCodeInput.value);
      if(res.ok) passGate();
      else failGate(res.msg);
    });

    // 엔터로도 확인
    [gateIdInput, gateCodeInput].forEach(inp => {
      inp.addEventListener("keydown", (e) => {
        if(e.key === "Enter") btnGateEnter.click();
      });
    });

    // 자동 로그인(유지)
    if(localStorage.getItem(SESSION_KEY) === "1"){
      gateEl.style.display = "none";
      appEl.style.display = "block";
      initGuildWar();
    }else{
      gateEl.style.display = "block";
      appEl.style.display = "none";
    }

    // =========================================================
    // ✅ 3) 기존 길드전 코드(그대로) — initGuildWar로 감쌈(추가된 부분)
    // =========================================================
    function initGuildWar(){
      // 중복 실행 방지
      if(window.__GUILD_INITED__) return;
      window.__GUILD_INITED__ = true;

      const slots = [null, null, null];
      let activeSlotIndex = 0;

      let UNITS = [];
      let RESULTS = [];
      let currentIndex = 0;

      const modalBack = document.getElementById("modalBack");
      const unitListEl = document.getElementById("unitList");
      const searchInput = document.getElementById("searchInput");
      const statusText = document.getElementById("statusText");
      const resultBox = document.getElementById("resultBox");

      function escapeHtml(str) {
        return String(str ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function renderSlots(){
        document.querySelectorAll(".slot").forEach((el) => {
          const idx = Number(el.dataset.slot);
          const s = slots[idx];

          el.classList.toggle("filled", !!s);
          el.innerHTML = "";

          const rm = document.createElement("button");
          rm.className = "remove";
          rm.title = "제거";
          rm.textContent = "×";
          rm.addEventListener("click", (e) => {
            e.stopPropagation();
            clearSlot(idx);
          });
          el.appendChild(rm);

          if(!s){
            const plus = document.createElement("div");
            plus.className = "plus";
            plus.textContent = "+";
            el.appendChild(plus);
            return;
          }

          const thumb = document.createElement("div");
          thumb.className = "thumb";
          const img = document.createElement("img");
          img.src = s.image_url;
          img.alt = s.name;
          thumb.appendChild(img);

          const nm = document.createElement("div");
          nm.className = "name";
          nm.textContent = s.name;

          el.appendChild(thumb);
          el.appendChild(nm);
        });
      }

      function updateResultHint(){
        const chosen = slots.filter(Boolean);
        if(chosen.length < 3){
          statusText.textContent = "검색 전";
          resultBox.textContent = "방어 유닛 3명을 선택해 주세요";
          RESULTS = [];
          currentIndex = 0;
          return;
        }
        statusText.textContent = "준비됨";
        resultBox.textContent = `선택됨: ${chosen.map(x=>x.name).join(", ")}`;
      }

      function renderUnitList(list){
        unitListEl.innerHTML = "";
        list.forEach((u) => {
          const row = document.createElement("div");
          row.className = "item";
          row.innerHTML = `
            <div class="thumb"><img src="${u.image_url}" alt="${escapeHtml(u.name)}"></div>
            <div class="name">${escapeHtml(u.name)}</div>
          `;
          row.addEventListener("click", () => {
            setSlot(activeSlotIndex, u);
            closeModal();
          });
          unitListEl.appendChild(row);
        });

        if(list.length === 0){
          unitListEl.innerHTML = `<div style="padding:14px;color:#6b7280;font-size:13px;">검색 결과가 없습니다</div>`;
        }
      }

      function setSlot(i, unit){
        const already = slots.findIndex(s => s && s.name === unit.name);
        if(already !== -1 && already !== i){
          alert("이미 선택된 유닛입니다.");
          return;
        }
        slots[i] = { id: unit.id, name: unit.name, image_url: unit.image_url };
        renderSlots();
        updateResultHint();
      }

      function clearSlot(i){
        slots[i] = null;
        renderSlots();
        updateResultHint();
      }

      function openModal(slotIndex){
        activeSlotIndex = slotIndex;
        modalBack.style.display = "flex";
        searchInput.value = "";
        renderUnitList(UNITS);
        setTimeout(() => searchInput.focus({ preventScroll:true }), 50);
      }
      function closeModal(){
        modalBack.style.display = "none";
      }

      document.getElementById("btnClose").addEventListener("click", closeModal);
      modalBack.addEventListener("click", (e) => {
        if(e.target === modalBack) closeModal();
      });
      document.querySelectorAll(".slot").forEach((el) => {
        el.addEventListener("click", () => openModal(Number(el.dataset.slot)));
      });

      function cellHtml(unit){
        if(!unit){
          return `
            <div class="cell">
              <div class="emptyBox">없음</div>
              <div class="cap">없음</div>
            </div>
          `;
        }
        return `
          <div class="cell">
            <img src="${unit.image_url}" alt="${escapeHtml(unit.name)}">
            <div class="cap">${escapeHtml(unit.name)}</div>
          </div>
        `;
      }

      function renderSingleResult(){
        const total = RESULTS.length;
        const hasAny = total > 0;

        const idx = Math.min(Math.max(currentIndex, 0), Math.max(total - 1, 0));
        currentIndex = idx;

        const r = hasAny ? RESULTS[idx] : null;

        const atkArr = r ? r.atk : [null, null, null];
        const skArr  = r ? r.skill : [null, null, null];
        const pet    = r ? r.pet : null;

        const firstText = r?.first ?? "없음";
        const badgeClass =
          firstText === "선공" ? "badge red" :
          firstText === "후공" ? "badge blue" :
          "badge gray";

        const noteText = (r?.note ?? "").trim();
        const pageLabel = hasAny ? `${idx+1} / ${total}` : `0 / 0`;

        resultBox.innerHTML = `
          <div class="resultToolbar">
            <div style="font-weight:900;color:#111827;">검색 결과</div>
            <div class="pager">
              <button class="pagerBtn" id="btnPrev" ${(!hasAny || idx===0) ? "disabled":""}>◀</button>
              <div class="pageInfo">${pageLabel}</div>
              <button class="pagerBtn" id="btnNext" ${(!hasAny || idx===total-1) ? "disabled":""}>▶</button>
            </div>
          </div>

          <div class="card">
            <div class="gridLayout">
              <div class="panel">
                <div class="panelTitle">공격 유닛</div>
                <div class="grid3">
                  ${cellHtml(atkArr[0])}
                  ${cellHtml(atkArr[1])}
                  ${cellHtml(atkArr[2])}
                </div>
              </div>

              <div class="panel centerCol">
                <div class="panelTitle">추천 펫</div>
                ${pet ? `
                  <div class="cell">
                    <img src="${pet.image_url}" alt="${escapeHtml(pet.name)}">
                    <div class="petName">${escapeHtml(pet.name)}</div>
                  </div>
                ` : `
                  <div class="cell">
                    <div class="emptyBox">없음</div>
                    <div class="petName">없음</div>
                  </div>
                `}
              </div>

              <div class="panel">
                <div class="panelTitle">스킬 순서</div>
                <div class="grid3">
                  ${cellHtml(skArr[0])}
                  ${cellHtml(skArr[1])}
                  ${cellHtml(skArr[2])}
                </div>
              </div>

              <div class="panel centerCol">
                <div class="panelTitle">선 / 후</div>
                <span class="${badgeClass}">${escapeHtml(firstText)}</span>
              </div>

              <div class="panel notePanel">
                <div class="noteHead">📌 노트</div>
                <div class="noteText">${escapeHtml(noteText || "없음")}</div>
              </div>
            </div>
          </div>
        `;

        const prevBtn = document.getElementById("btnPrev");
        const nextBtn = document.getElementById("btnNext");

        if(prevBtn) prevBtn.addEventListener("click", () => {
          if(currentIndex > 0){
            currentIndex--;
            renderSingleResult();
          }
        });
        if(nextBtn) nextBtn.addEventListener("click", () => {
          if(currentIndex < total - 1){
            currentIndex++;
            renderSingleResult();
          }
        });
      }

      document.getElementById("btnReset").addEventListener("click", () => {
        slots[0]=slots[1]=slots[2]=null;
        RESULTS = [];
        currentIndex = 0;
        renderSlots();
        updateResultHint();
      });

      document.getElementById("btnSearch").addEventListener("click", async () => {
        const selected = slots.filter(Boolean);
        if(selected.length < 3){
          alert("방어 유닛 3명을 먼저 선택해 주세요.");
          return;
        }

        const defKey = selected
          .map(s => s.id)
          .sort()
          .join("|");

        statusText.textContent = "검색중...";
        resultBox.textContent = "잠시만...";

        const { data: rows, error } = await supabaseClient
          .from("guild_war_results")
          .select("result_id, atk_1, atk_2, atk_3, skill_1, skill_2, skill_3, pet, first, note, def_key")
          .eq("def_key", defKey)
          .order("result_id", { ascending: true });

        if(error){
          console.error(error);
          statusText.textContent = "에러";
          resultBox.textContent = "조회 실패(콘솔 확인)";
          return;
        }

        if(!rows || rows.length === 0){
          statusText.textContent = "결과 없음";
          RESULTS = [];
          currentIndex = 0;
          renderSingleResult();
          return;
        }

        const ids = new Set();
        rows.forEach(r => {
          [r.atk_1,r.atk_2,r.atk_3,r.skill_1,r.skill_2,r.skill_3,r.pet].forEach(x => {
            if(x) ids.add(x);
          });
        });

        const { data: unitRows, error: unitErr } = await supabaseClient
          .from("units")
          .select("id, name, image_url")
          .in("id", Array.from(ids));

        if(unitErr) console.error(unitErr);

        const unitMap = new Map((unitRows || []).map(u => [u.id, u]));

        RESULTS = rows.map(r => {
          const atk = [r.atk_1, r.atk_2, r.atk_3].map(id => unitMap.get(id) || null);
          const skill = [r.skill_1, r.skill_2, r.skill_3].map(id => unitMap.get(id) || null);
          const pet = unitMap.get(r.pet) || null;
          return {
            result_id: r.result_id,
            first: r.first ?? "없음",
            note: r.note ?? "",
            atk,
            skill,
            pet
          };
        });

        currentIndex = 0;
        statusText.textContent = `결과 ${RESULTS.length}개`;
        renderSingleResult();
      });

      searchInput.addEventListener("input", () => {
        const q = searchInput.value.trim().toLowerCase();
        if(!q){
          renderUnitList(UNITS);
          return;
        }
        const filtered = UNITS.filter(u => (u.name || "").toLowerCase().includes(q));
        renderUnitList(filtered);
      });

      async function loadUnits(){
        statusText.textContent = "유닛 로딩중...";
        const { data, error } = await supabaseClient
          .from("units")
          .select("id, name, image_url")
          .eq("kind", "unit")
          .order("name", { ascending: true });

        if(error){
          console.error(error);
          statusText.textContent = "유닛 로드 실패";
          resultBox.textContent = "유닛을 불러오지 못했습니다. (RLS/정책 또는 컬럼 확인)";
          return;
        }

        UNITS = (data || []).map(u => ({
          id: u.id,
          name: u.name,
          image_url: u.image_url
        }));

        statusText.textContent = `유닛 ${UNITS.length}개 로드됨`;
        updateResultHint();
      }

      // 초기 실행
      renderSlots();
      updateResultHint();
      loadUnits();
    }
  </script>
</body>
</html>
